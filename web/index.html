<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Botonera</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Botonera">
<meta name="theme-color" content="#1F2D3D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Serif:wght@400;600&display=swap">
<style>
  :root{
    --bg:#f6f3ee; --surface:#ffffff; --surface-2:#faf8f4;
    --ink:#1f2328; --muted:#5f6670; --faint:#9aa0a8;
    --line:#e4dfd6; --line-strong:#cfc8bb;
    --brand:#2f5d8a; --brand-bg:#eaf0f6; --on-brand:#ffffff;
    --go:#1f8a56; --go-bg:#e3f3e9;
    --warn:#b5761a; --warn-bg:#f8eede;
    --no:#c0435a; --no-bg:#fae6ea;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --r-s:8px; --r-m:12px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#121417; --surface:#1b1e23; --surface-2:#20242a;
      --ink:#e8eaed; --muted:#a2a9b2; --faint:#6f7781;
      --line:#2c3138; --line-strong:#3a4049;
      --brand:#7fb0e0; --brand-bg:#1e2a37; --on-brand:#101418;
      --go:#4cc588; --go-bg:#14301f;
      --warn:#d9a24a; --warn-bg:#322612;
      --no:#e8788c; --no-bg:#331920;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%;
    overflow-x:hidden;
  }
  button,input{font:inherit;color:inherit}
  .wrap{max-width:1180px;margin:0 auto;padding:0 16px 16px}
  .top{display:flex;align-items:center;gap:12px;padding:16px 0 12px}
  .top h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
  .top .btn{margin-left:auto}
  .btn{
    border:.5px solid var(--line-strong);background:var(--surface);color:var(--ink);
    border-radius:var(--r-s);padding:6px 12px;cursor:pointer;font-size:13px;
  }
  .btn:hover{background:var(--surface-2)}
  .btn.primario{background:var(--brand);color:var(--on-brand);border-color:var(--brand);font-size:15px;padding:10px 16px}
  .btn.primario:hover{opacity:.92}
  .btn[disabled]{opacity:.55;cursor:default}

  /* pantalla de entrada */
  .entrada{max-width:380px;margin:12vh auto 0;text-align:center}
  .entrada h1{font-size:20px;margin:0 0 6px;font-weight:600}
  .entrada p{color:var(--muted);margin:0 0 20px}
  .entrada .btn.primario{width:100%}
  .pin{
    display:block;width:100%;margin:0 0 12px;padding:12px 8px 12px calc(8px + .5em);
    border:.5px solid var(--line-strong);border-radius:var(--r-m);background:var(--surface);
    text-align:center;font-size:32px;line-height:1.2;letter-spacing:.5em;
    font-variant-numeric:tabular-nums;-webkit-text-security:disc;
  }
  .pin:focus{outline:2px solid var(--brand);outline-offset:1px}
  .pin[disabled]{opacity:.6}
  .aviso{margin-top:12px;font-size:13px;color:var(--muted);min-height:1.4em}
  .aviso.err{color:var(--no)}
  .aviso.ok{color:var(--go)}

  /* app */
  .app{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
  /* el home es solo el swipe: sin la lista de botoneras ni el panel vacio; el panel aparece solo con ?c=<clave> */
  .app:not(.detalle){grid-template-columns:minmax(0,440px);justify-content:center}
  .app:not(.detalle) .panel{display:none}
  @media (min-width:860px){
    .app{grid-template-columns:340px minmax(0,1fr)}
    .lista{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
  }
  .lista{min-width:0}
  .grupo{background:var(--surface);border:.5px solid var(--line);border-radius:var(--r-m);margin-bottom:10px;overflow:hidden}
  .grupo-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:.5px solid var(--line)}
  .grupo-h .t{font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill{
    display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 7px;
    border-radius:10px;font-size:12px;font-weight:600;background:var(--brand-bg);color:var(--brand);flex:none;
  }
  .pill.mudo{background:var(--surface-2);color:var(--muted);border:.5px solid var(--line)}
  .pill.warn{background:var(--warn-bg);color:var(--warn)}
  .pill.go{background:var(--go-bg);color:var(--go)}
  .pill.no{background:var(--no-bg);color:var(--no)}
  .grupo-h .pill{margin-left:auto}
  .item{
    display:block;width:100%;text-align:left;background:none;border:0;border-top:.5px solid var(--line);
    padding:10px 12px;cursor:pointer;
  }
  .grupo-h + .item{border-top:0}
  .item:hover{background:var(--surface-2)}
  .item.sel{background:var(--brand-bg)}
  .item .t{font-size:14px;overflow-wrap:anywhere}
  .item .m{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px;font-size:12px;color:var(--muted)}
  .plegable{background:var(--surface);border:.5px solid var(--line);border-radius:var(--r-m);margin-bottom:10px;overflow:hidden}
  .plegable summary{list-style:none;cursor:pointer;padding:10px 12px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .plegable summary::-webkit-details-marker{display:none}
  .plegable summary::before{content:"+";display:inline-block;width:12px;color:var(--faint)}
  .plegable[open] summary::before{content:"\2212"}
  .plegable summary .pill{margin-left:auto}
  .vacio{padding:24px 12px;text-align:center;color:var(--muted);font-size:14px;background:var(--surface);border:.5px solid var(--line);border-radius:var(--r-m)}

  .panel{min-width:0}
  .panel-vacio{padding:48px 16px;text-align:center;color:var(--muted);background:var(--surface);border:.5px solid var(--line);border-radius:var(--r-m)}
  .cab{background:var(--surface);border:.5px solid var(--line);border-radius:var(--r-m);padding:14px;margin-bottom:12px}
  .cab h2{margin:0 0 6px;font-size:17px;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
  .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted)}
  .meta b{font-weight:500;color:var(--ink)}
  .pasos{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .paso{
    flex:1 1 150px;min-width:0;border:.5px solid var(--line);border-radius:var(--r-s);padding:8px 10px;
    background:var(--surface-2);color:var(--muted);
  }
  .paso .n{font-size:13px;font-weight:600}
  .paso .h{font-size:12px;margin-top:2px;min-height:1.3em}
  .paso.hecho{background:var(--go-bg);border-color:transparent;color:var(--go)}
  .paso.hecho .h{color:var(--ink)}
  .nota-estado{margin-top:10px;font-size:13px;color:var(--warn);background:var(--warn-bg);border-radius:var(--r-s);padding:8px 10px}
  /* Claude trabajando: puntito que late (CSS puro). Sin animacion si la persona pidio menos movimiento */
  .trab{display:inline-flex;align-items:center;gap:6px;color:var(--brand);font-weight:500}
  .trab.largo{color:var(--warn)}
  .pulso{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;flex:none;animation:latido 1.4s ease-in-out infinite}
  @keyframes latido{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.65)}}
  @media (prefers-reduced-motion: reduce){ .pulso{animation:none} }
  .paso.trab-p{background:var(--brand-bg);border-color:transparent}
  .paso.trab-p .n{color:var(--brand)}
  .paso.trab-p .h{color:var(--brand)}
  .paso.trab-p.largo .n,.paso.trab-p.largo .h{color:var(--warn)}
  .paso.trab-p.largo{background:var(--warn-bg)}
  .paso.espera-p{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
  .paso.espera-p .h{color:var(--ink)}
  /* te espera: la pelota la tiene el usuario en la conversacion */
  .espw{border-top:.5px solid var(--line)}
  .grupo-h + .espw{border-top:0}
  .espw .item{border-top:0;background:none;padding-bottom:4px}
  .espw:hover{background:var(--surface-2)}
  .espw.sel,.espw.sel:hover{background:var(--brand-bg)}
  .espw .espera-m{font-size:13px;margin-top:4px;overflow-wrap:anywhere}
  .espw .lnk-ses{display:inline-block;margin:0 12px 10px}
  .espera-blq{background:var(--warn-bg);border-radius:var(--r-m);padding:12px 14px;margin-bottom:12px}
  .espera-blq .et{font-size:13px;font-weight:600;color:var(--warn)}
  .espera-blq .em{font-size:14px;margin-top:2px;overflow-wrap:anywhere}
  .espera-blq .ef{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;margin-top:6px;font-size:12.5px;color:var(--muted)}
  .lnk-ses{color:var(--brand);text-decoration:none;font-size:13px;white-space:nowrap}
  .lnk-ses:hover{text-decoration:underline}
  .lnk-ses.chico{flex:none;font-size:15px;line-height:1;padding:2px 4px;border-radius:var(--r-s)}
  .lnk-ses.chico:hover{background:var(--brand-bg);text-decoration:none}
  /* lo decidido: lectura, no botonera */
  .dec{background:var(--surface);border:.5px solid var(--line);border-radius:var(--r-m);padding:14px;margin-bottom:12px}
  .dec-t{font-size:13px;font-weight:600;margin-bottom:2px}
  .dec-sub{font-size:12px;color:var(--muted);margin-bottom:6px}
  .dec-vacio{font-size:14px;color:var(--muted);padding:4px 0}
  .dec-fila{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:.5px solid var(--line)}
  .dec-n{flex:none;width:22px;text-align:right;font-size:12px;color:var(--faint);padding-top:2px}
  .dec-fila .pill{min-width:78px;margin-top:0}
  .dec-x{min-width:0;flex:1;overflow-wrap:anywhere;font-size:14px}
  .dec-x .a{font-size:12.5px;color:var(--muted);margin-top:1px}
  .dec-x .c{font-size:13px;margin-top:4px;padding:5px 8px;border-radius:var(--r-s);background:var(--warn-bg);color:var(--ink)}
  .dec-x .c b{font-weight:600;color:var(--warn)}
  /* lo pendiente: filas activas del MISMO bloque que lo decidido (fondo crema = lo que falta) */
  .dec-fila.pend{background:var(--warn-bg);border-top:0;border-radius:var(--r-s);padding:10px 8px;margin-top:6px}
  .p-ctx{font-size:12.5px;color:var(--muted);margin-top:3px}
  .p-img{margin-top:8px}
  .p-img img{display:block;width:100%;height:auto;max-height:180px;object-fit:cover;object-position:top;border-radius:var(--r-s);border:1px solid var(--line)}
  .p-det{margin-top:6px;font-size:12.5px;color:var(--muted)}
  .p-det summary{cursor:pointer;color:var(--ink);font-weight:500}
  .p-det .p-imp{margin-top:6px}
  .p-img .afuera,.sw-img .afuera{display:inline-block;margin-top:4px;font-size:12.5px}
  .p-imp{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px;font-size:12.5px;color:var(--muted)}
  .p-imp div{padding:6px 8px;border-radius:var(--r-s);border-left:3px solid}
  .p-imp b{display:block;font-weight:600;color:var(--ink)}
  .p-imp .pos{border-color:var(--go)}
  .p-imp .neg{border-color:var(--no)}
  @media (max-width:520px){ .p-imp{grid-template-columns:1fr} }
  .p-fte{font-size:12.5px;color:var(--muted);margin-top:6px}
  .p-fte span{font-weight:600;color:var(--ink)}
  .p-intro{font-size:12.5px;color:var(--muted);margin-top:6px;padding:8px 10px;border-radius:var(--r-s);border:1px dashed var(--line)}
  .p-intro b{font-weight:600;color:var(--ink)}
  .p-intro ul{margin:2px 0 0 16px;padding:0}
  .dec a.lnk,.p-img a,.sw-dcard a,.sw-ct a{color:inherit;text-decoration:underline;overflow-wrap:anywhere}
  .p-antec{font-size:12.5px;color:var(--muted);margin-top:6px}
  .p-antec b{font-weight:600;color:var(--ink)}
  .p-antec ul{margin:2px 0 0 16px;padding:0}
  .p-antec .snd{margin-top:4px}
  .p-reco{font-size:12.5px;margin-top:6px;color:var(--muted)}
  .p-reco b{font-weight:600}
  .p-reco .r-go{color:var(--go)}
  .p-reco .r-no{color:var(--no)}
  .p-acc{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .pb{
    flex:1 1 96px;min-width:0;font-size:14px;font-weight:600;padding:9px 10px;border-radius:var(--r-s);cursor:pointer;
    border:1.5px solid var(--line-strong);background:var(--surface);color:var(--muted);overflow-wrap:anywhere;
  }
  .pb.go.rec{border-color:var(--go);color:var(--go)}
  .pb.no.rec{border-color:var(--no);color:var(--no)}
  .pb.go:hover:not([disabled]){border-color:var(--go);color:var(--go)}
  .pb.no:hover:not([disabled]){border-color:var(--no);color:var(--no)}
  .pb.go.on{background:var(--go);border-color:var(--go);color:#fff}
  .pb.no.on{background:var(--no);border-color:var(--no);color:#fff}
  .pb[disabled]{cursor:default;opacity:.7}
  .pcom{
    display:block;width:100%;margin-top:8px;padding:8px 10px;font-size:14px;
    border:.5px solid var(--line-strong);border-radius:var(--r-s);background:var(--surface);color:var(--ink);
  }
  .pcom:focus{outline:2px solid var(--brand);outline-offset:1px}
  .pcom[disabled]{opacity:.7}
  .p-bar{
    position:sticky;bottom:0;z-index:2;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--surface);border-top:.5px solid var(--line);padding:10px 0;margin-top:6px;
  }
  .p-bar .cnt{font-size:13px;color:var(--muted)}
  .p-bar .btn.primario{margin-left:auto}
  .p-msg{flex:1 0 100%;font-size:12.5px;color:var(--no)}
  .p-sub{font-size:12.5px;color:var(--muted);margin-top:8px}
  .p-sub .lnk-ses{margin-left:6px}
  @media (max-width:859px){ .pcom{font-size:16px} }
  .dec-txt{font-size:13.5px;overflow-wrap:anywhere}
  .dec-txt div.l{padding:2px 0}
  .dec-sec{margin-top:12px;padding-top:10px;border-top:.5px solid var(--line)}
  .marco{border:.5px solid var(--line);border-radius:var(--r-m);overflow:hidden;background:var(--surface)}
  /* alto fijo de viewport: --ocupado lo mide medirMarco() (lo que hay arriba del iframe). El scroll va adentro. */
  .marco iframe{
    display:block;width:100%;border:0;background:transparent;
    height:calc(100vh - var(--ocupado,260px));
    height:calc(100dvh - var(--ocupado,260px));
    min-height:420px;
  }
  .marco.orig iframe{height:75vh;height:75dvh;min-height:420px}
  .volver{display:none;margin-bottom:10px}
  @media (max-width:859px){
    .volver{display:inline-block}
    /* el link claude:// solo abre en la Mac con la app: en el celu no sirve */
    .lnk-ses,.espw .lnk-ses{display:none}
    .espw .item{padding-bottom:10px}
    /* en el celu se ve la lista o la botonera, nunca las dos apiladas */
    .app.detalle .lista{display:none}
    .app:not(.detalle) .panel{display:none}
  }

  /* ---------- modo swipe: paleta propia, no sigue el tema claro/oscuro de la pagina ---------- */
  .cab-acc{margin-top:12px;display:flex}
  .cab-acc .btn{padding:9px 16px;font-size:14px;font-weight:600}
  html.sw-lock,html.sw-lock body{overflow:hidden}
  .sw{
    position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:#F5F0E8;color:#1C1B1B;
    font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.45;
    overflow:hidden;overscroll-behavior:contain;-webkit-tap-highlight-color:transparent;
  }
  .sw *{box-sizing:border-box}
  .sw button{font-family:inherit;color:#1C1B1B;cursor:pointer}
  .sw-main{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:460px;margin:0 auto}
  .sw-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 4px;flex:none}
  .sw-st{font-size:14px;font-weight:700}
  .sw-b{border:2px solid #1C1B1B;background:#fff;border-radius:10px;padding:6px 12px;font-size:13px;font-weight:700;min-height:36px}
  .sw-b[disabled]{opacity:.4;cursor:default}
  .sw .sw-tr{display:flex;gap:6px}
  .sw .sw-env{background:#8ECAC8}
  .sw-prog{flex:none;padding:2px 16px 8px;text-align:center;font-size:13px;font-weight:600;color:#3a3837}
  .sw-prog b{font-weight:700;color:#1C1B1B}
  .sw-aviso{flex:none;margin:0 14px 8px;padding:8px 10px;border:2px solid #1C1B1B;border-radius:10px;background:#FFF1C7;font-size:13px;font-weight:600}
  .sw-stage{flex:1 1 auto;min-height:0;position:relative;display:flex;padding:6px 22px 22px 14px}
  .sw-stack{position:relative;flex:1;min-width:0;min-height:220px}
  .sw-peek{position:absolute;inset:0;z-index:0;transform:translate(8px,8px);background:#fff;border:2px solid #1C1B1B;border-radius:12px}
  .sw-hints{position:absolute;inset:0;z-index:1;border-radius:12px;overflow:hidden;pointer-events:none}
  .sw-h{position:absolute;inset:8px;border-radius:12px;opacity:0;display:flex;padding:12px;box-shadow:0 0 0 1px rgba(28,27,27,.15)}
  .sw-h i{display:flex;flex-direction:column;align-items:center;gap:6px;font-style:normal;font-size:13px;font-weight:700;line-height:1.2;text-align:center;max-width:96px;overflow-wrap:anywhere}
  .sw-h svg{width:28px;height:28px;flex:none}
  .sw-h.go{background:#8ECAC8;color:#1C1B1B;align-items:center;justify-content:flex-start}
  .sw-h.no{background:#262626;color:#fff;align-items:center;justify-content:flex-end}
  .sw-h.no svg{stroke:#E5E5E5}
  .sw-h.up{background:#E5E5E5;color:#1C1B1B;align-items:flex-end;justify-content:center}
  .sw-card{
    position:absolute;inset:0;z-index:2;background:#fff;border:2px solid #1C1B1B;border-radius:12px;overflow:hidden;
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;will-change:transform;
  }
  .sw-card.arr{cursor:grabbing}
  .sw-card:focus-visible{outline:3px solid #8ECAC8;outline-offset:3px}
  .sw-card img{-webkit-user-drag:none;pointer-events:none}
  .sw-ct{padding:18px 18px 0;display:flex;flex-direction:column;gap:12px;height:100%}
  .sw-card h2,.sw-dcard h2,.sw-msg h2{font-family:"Noto Serif",Georgia,"Times New Roman",serif;font-weight:600;margin:0;color:#1C1B1B}
  .sw-card h2{font-size:21px;line-height:1.28;overflow-wrap:anywhere}
  .sw-ctx{margin:0;font-size:15px;color:#3a3837;overflow-wrap:anywhere}
  .sw-dib{display:block;width:100%;max-height:150px;object-fit:contain;background:#FAF7F0;border-radius:8px;padding:8px;flex:none}
  .sw-img{flex:none}
  .sw-img img{display:block;width:100%;max-height:220px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid #E6E1D8}
  .sw-img.grande img{max-height:none}
  .sw-reco{margin:0;font-size:14px;color:#3a3837;overflow-wrap:anywhere}
  .sw-reco b{font-weight:700}
  .sw-reco .r-go{color:#1F6F6B}
  .sw-reco .r-no{color:#1C1B1B}
  .sw-vence{align-self:flex-start;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:#F5F0E8;border:1.5px solid #1C1B1B}
  .sw-vence.venc{background:#FFE2D6}
  .sw-fade{
    position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;display:flex;align-items:flex-end;justify-content:center;
    padding-bottom:8px;font-size:12px;font-weight:700;color:#6b6866;background:linear-gradient(rgba(255,255,255,0),#fff 72%);
  }

  .sw-dcard .sw-s{font-size:14px;color:#3a3837}

  .sw-tema{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;margin-bottom:8px;padding:12px 14px;border:2px solid #1C1B1B;border-radius:12px;background:#fff;font-size:15px;font-weight:700;text-align:left}

  @media (prefers-reduced-motion: reduce){ .sw *{scroll-behavior:auto} }
  /* tipos de card: opciones, casillas y Editar, antes «Va, pero…» */
  .sw-hints.solo-up .sw-h.go,.sw-hints.solo-up .sw-h.no{display:none}
  .sw-ops{display:flex;flex-direction:column;gap:8px}

  .sw-op .rt,.sw-chk .rt{display:block;font-size:12px;font-weight:600;color:#1F6F6B}

  .sw-chk input{flex:none;width:22px;height:22px;margin:0;accent-color:#1F6F6B}

  .sw-op.ed .ic{width:16px;height:16px;flex:none;margin-right:6px}   /* Editar en las cards de opciones */
  /* Editar: los valores que propuso el agente, cargados en campos */
  .sw-act .ic{width:16px;height:16px;flex:none;margin-right:6px}
  .sw-ed-lead{margin:4px 0 14px;font-size:14px;color:#3a3837}
  .sw-fs{display:flex;flex-direction:column;gap:14px}
  .sw-f{display:flex;flex-direction:column;gap:6px}
  .sw-f label{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
  .sw-in{width:100%;min-height:48px;padding:10px 12px;border:2px solid #1C1B1B;border-radius:10px;background:#fff;color:#1C1B1B;font:16px/1.3 Manrope,-apple-system,system-ui,sans-serif}
  .sw-in:focus{outline:3px solid #8ECAC8;outline-offset:1px}
  .sw-f.cambio .sw-in{border-color:#1F6F6B;background:#EAF6F5;box-shadow:inset 0 0 0 2px #8ECAC8;font-weight:700}
  .sw-tag{display:none;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;background:#8ECAC8;border:1.5px solid #1C1B1B}
  .sw-fnota{display:none;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:#3a3837}
  .sw-f.cambio .sw-tag{display:inline-block}
  .sw-f.cambio .sw-fnota{display:flex}
  .sw-fnota s{color:#6b6866}
  .sw-fre{border:0;background:none;padding:0 4px;min-height:36px;font-size:13px;font-weight:700;text-decoration:underline;color:#1F6F6B}
  .sw-resumen{text-align:center;font-size:13px;font-weight:600;color:#3a3837}
  .sw-pend{display:flex;flex-direction:column;gap:1px;margin:10px 0 0;padding:6px 12px;border:1.5px solid #1F6F6B;border-radius:12px;background:#EAF6F5;color:#1F6F6B;font-size:14px;font-weight:800}
  .sw-pend span{font-size:12px;font-weight:600;color:#3a3837}
  .sw-sheet .sw-bar{padding-top:8px}
  /* «todas juntas»: la botonera entera en una lista, cada card con sus botones */
  .sw-lbarra{flex:none;height:4px;margin:0 16px 8px;border-radius:2px;background:#E5E5E5;overflow:hidden}
  .sw-lbarra i{display:block;height:100%;background:#1F6F6B;transition:width .3s}
  .sw-lidx{flex:none;display:flex;gap:6px;overflow-x:auto;padding:0 14px 8px;scrollbar-width:none}

  .sw-lchip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border:2px solid #1C1B1B;border-radius:99px;background:#fff;font-size:13px;font-weight:700}

  .sw-lscroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 14px max(16px,env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}

  .sw-lcard .sw-lbl{margin:0 2px 6px}
  .sw-lcard .sw-com{min-height:64px}
  .sw-lbar{display:flex;flex-direction:column;gap:8px}
  .sw-lcard.hecha{border-left-width:8px;border-left-color:#8ECAC8}
  .sw-lcard.hecha.m-no{border-left-color:#262626}
  .sw-lhecha{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:12px;border-top:2px dashed #E5E5E5}
  .sw-lmarca{font-size:14px;font-weight:700;padding:4px 12px;border-radius:99px;background:#DCEFEE}
  .m-no .sw-lmarca{background:#262626;color:#fff}
  .sw-lcom{flex-basis:100%;margin:0;font-size:14px;color:#3a3837;white-space:pre-wrap;overflow-wrap:anywhere}
  .sw-lpie{display:flex;justify-content:center;padding:6px 0 10px}
  .sw-lfin{margin:4px 0 14px}
  .sw-lfin .sw-lbl{margin:0 2px 6px}
  .sw-b.sw-undo{display:flex;align-items:center;justify-content:center;width:44px;padding:0}
  .sw-b.sw-undo[disabled]{opacity:.35}

  /* ---------- home del swipe (maqueta B): paleta propia, igual en claro y en oscuro ---------- */
  .h-tit{margin:2px 2px 8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .home{
    margin-bottom:16px;padding:14px;background:#F5F0E8;border:2px solid #1C1B1B;border-radius:22px;color:#1C1B1B;
    font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  }
  .home:empty{display:none}
  .home button{cursor:pointer;font-family:inherit}
  .home-hero{position:relative;overflow:hidden;min-height:196px;padding:18px;border-radius:22px;background:#1C1B1B;color:#fff;display:flex;flex-direction:column;align-items:flex-start}
  .home-k{font-size:12px;font-weight:700;opacity:.7;text-transform:uppercase;letter-spacing:.06em}
  .home-t{margin:6px 0 4px;font:400 30px/1.1 "Noto Serif",Georgia,"Times New Roman",serif}
  .home-s{max-width:62%;font-size:13px;opacity:.75}
  .home-stack{position:absolute;right:-6px;bottom:-14px;width:120px;height:150px;pointer-events:none}
  .home-stack div{position:absolute;inset:0;border:2px solid #F5F0E8;border-radius:14px;background:#2d2c2b}
  .home-stack div:nth-child(1){transform:rotate(14deg) translate(18px,6px);background:#3a3938}
  .home-stack div:nth-child(2){transform:rotate(6deg) translate(8px,2px)}
  .home-stack div:nth-child(3){background:#fff;border-color:#fff}
  .home-stack div:nth-child(3)::after{content:"";position:absolute;left:14px;right:30px;top:20px;height:10px;border-radius:5px;background:#1C1B1B;box-shadow:0 18px 0 -2px #d4d4d4,0 34px 0 -2px #d4d4d4}
  .home-l{margin-top:6px;font-size:13px;font-weight:700;color:#8ECAC8}
  .home-acts{position:relative;z-index:1;margin-top:auto;display:flex;flex-wrap:wrap;gap:8px;max-width:66%}
  .home-env{padding:10px 16px;border:2px solid #fff;border-radius:14px;background:transparent;color:#fff;font-size:15px;font-weight:800}
  .home-env[disabled]{opacity:.6;cursor:default}
  .home-frase{max-width:92%;margin:8px 0 0;font:italic 400 16px/1.4 "Noto Serif",Georgia,"Times New Roman",serif;opacity:.92}
  .home-autor{margin-top:8px;font-size:12px;opacity:.65}
  .confeti{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:60}
  .home-avisos{margin-top:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted)}
  .home-avisos button{font:inherit;font-weight:600;padding:9px 14px;border-radius:99px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer}
  .home-res{margin-top:10px;font-size:12.5px;font-weight:600}
  .home-res .ok{color:#1F6F6B}
  .home-res .mal{color:#8a3b2a}
  .home-cta{
    position:relative;z-index:1;display:flex;align-items:center;gap:8px;padding:12px 18px;border:0;border-radius:14px;
    background:#8ECAC8;color:#1C1B1B;font-size:15px;font-weight:800;
  }
  .home-cta svg{width:18px;height:18px;flex:none;fill:none;stroke:#1C1B1B;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .home-err{margin-top:10px;font-size:12.5px;font-weight:600;color:#8a3b2a}
  /* fila «Con error»: arriba del home, solo si hay errores sin ver. Mismo rojo apagado que .home-err, sobre un fondo crema rosado */
  .herr{margin-bottom:14px;padding:12px 14px 12px;border:2px solid #8a3b2a;border-radius:16px;background:#F8E1DA;color:#1C1B1B}
  .herr-k{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#8a3b2a}
  .herr-i{display:flex;align-items:flex-start;gap:10px;margin-top:10px;padding-top:10px;border-top:1.5px solid rgba(138,59,42,.28)}
  .herr-k + .herr-i{border-top:0;padding-top:0;margin-top:8px}
  .herr-tx{flex:1;min-width:0;display:block}
  .herr-tx b{display:block;font-size:14px;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
  .herr-m{display:block;margin-top:2px;font-size:12.5px;line-height:1.35;color:#5b2a1f;overflow-wrap:anywhere}
  .herr-w{display:block;margin-top:3px;font-size:11.5px;color:#6B7280}

  .hrows{margin-top:14px;display:flex;flex-direction:column;gap:10px}
  .hrow{
    display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;text-align:left;background:#fff;color:#1C1B1B;
    border:2px solid #1C1B1B;border-radius:16px;
  }
  .hic{width:46px;height:46px;flex:none;display:grid;place-items:center;border:1.5px solid #1C1B1B;border-radius:12px}
  .hic img{display:block;width:26px;height:26px}
  .htx{flex:1;min-width:0;display:block}
  .htx b{display:block;font-size:15px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* mazo del home: de donde viene cada card, y el resumen por botonera */
  .sw-orig{display:flex;align-items:center;gap:8px;min-width:0}
  .sw-catchip{display:inline-flex;align-items:center;gap:6px;flex:none;padding:3px 10px 3px 6px;border:1.5px solid #1C1B1B;border-radius:99px;font-size:12px;font-weight:800;color:#1C1B1B}

  .sw-lst{width:100%;max-width:340px;text-align:left}
  .sw-sig .hrows{margin-top:4px}
  /* en web el mazo usa mas ancho: lo que se mira adentro se lee sin ampliar. Mismo corte que el resto de la pagina */
  @media (min-width:860px){.sw-main,.sw-sheet-in{max-width:760px}.sw-lst,.sw-big{max-width:560px}}
  /* una categoria con varias botoneras: una tarjetita negra por botonera, para elegir a cual entrar */
  .hcat-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .hcat-vol{border:2px solid #1C1B1B;border-radius:10px;background:#fff;color:#1C1B1B;font-size:13px;font-weight:700;padding:6px 10px}

  .htandas{display:flex;flex-direction:column;gap:10px}

  .hcat-env .home-acts{margin-top:10px;max-width:none}
  .htanda{display:block;width:100%;padding:14px 16px;text-align:left;border:0;border-radius:18px;background:#1C1B1B;color:#fff}
  .sw .htanda{color:#fff} /* adentro del mazo «.sw button» la pintaba de negro sobre negro: la card salia vacia */
  .htanda .hk{display:block;font-size:11px;font-weight:700;opacity:.65;text-transform:uppercase;letter-spacing:.06em}
  .htanda .ht{display:block;margin:4px 0 4px;font:400 20px/1.2 "Noto Serif",Georgia,"Times New Roman",serif;text-wrap:balance}
  .htanda .hc{display:block;font-size:13px;line-height:1.35;opacity:.8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  .sw-gt{margin:6px 0 4px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#6b6866}
  .sw-bi{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;padding:8px 10px;margin-bottom:6px;background:#fff;border:2px solid #1C1B1B;border-radius:12px}
  .sw-bn{flex:1 1 140px;min-width:0;overflow-wrap:anywhere;font-size:14px;font-weight:700}
  .sw-bs{font-size:12px;color:#6b6866;font-variant-numeric:tabular-nums}
  .sw-be{flex:1 0 100%;font-size:12px;font-weight:700;color:#6b6866}
  .sw-be.ok{color:#1F6F6B}
  .sw-be.mal{color:#A1263A}
  /* accent de una card (danger = «ojo», warning = «sensible»): los colores de la plantilla; en el swipe, fijos (la paleta no sigue al tema) */
  .sw-tags{display:flex;flex-wrap:wrap;align-items:center;gap:6px;align-self:flex-start}
  .ac-tag{display:inline-block;font-size:12px;font-weight:800;line-height:1.4;border-radius:99px;padding:1px 9px;border:1.5px solid currentColor}

  .ac-tag.danger{color:var(--no);background:var(--no-bg)}

  .sw .ac-tag.danger{color:#a3263f;background:#f8d5dc}

  .p-tags{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:4px}

  .sw-ico{display:block;width:56px;height:56px;flex:none;padding:6px;border-radius:12px;background:#FAF7F0}

  .sw-ico.danger{background:#fae6ea}
  .sw-ant{margin:0;font-size:13px;color:#3a3837;overflow-wrap:anywhere}
  .sw-ant b{font-weight:700;color:#1C1B1B}
  .sw-ant ul{margin:2px 0 0 18px;padding:0}
  .sw-nota{flex:none;margin:-4px 16px 8px;text-align:center;font-size:12px;color:#6b6866;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}

<div class="wrap" id="raiz"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script>
(function(){
'use strict';

// Config de tu proyecto Supabase: sale de /config.js (window.BOTONERA_CONFIG). La llave publishable es publica por diseno: los permisos los da RLS.
var CFG = window.BOTONERA_CONFIG || {};
var SUPABASE_URL = typeof CFG.supabaseUrl === 'string' ? CFG.supabaseUrl.trim() : '';
var SUPABASE_KEY = typeof CFG.supabaseKey === 'string' ? CFG.supabaseKey.trim() : '';
function configValida(){
  // https, o http solo contra un Supabase local (supabase start)
  if(!/^(https:\/\/[^\s\/]+|http:\/\/(localhost|127\.0\.0\.1)(:\d+)?)/i.test(SUPABASE_URL) || !SUPABASE_KEY) return false;
  return !/TU[-_]PROYECTO|TU[-_]LLAVE/i.test(SUPABASE_URL + ' ' + SUPABASE_KEY);
}
var SIETE_DIAS = 7 * 24 * 3600 * 1000;
var CLAVE_TOKEN = 'bm-token';
var MAX_FALLOS = 10;
var POLL_MS = 15000;

var raiz = document.getElementById('raiz');
var sb = null;
var estado = {
  token: null,
  filas: [],
  sel: null,          // clave BASE de la tanda seleccionada
  vivo: null,         // iframe de la vuelta abierta (donde se decide): {iframe, clave, cargado:{clave, html, updated_at, estado}, recargar, errorAlCargar}
  orig: null,         // iframe de la botonera original (plegada, solo lectura): mismo formato
  poll: null,
  bloqueadas: {},
  marcas: {},         // clave -> {items, notas}: lo que el iframe va marcando (sobrevive a recargarlo)
  abiertos: {},       // data-k del <details> -> abierto/cerrado, lo que dejo la persona
  panelKey: null,     // base|a:<vuelta abierta> o base|d (sin vuelta abierta): cuando cambia, se rearma el panel
  decidido: null,     // {base, datos:{clave:{k,d}}, error, enVuelo}: lo que trajo bm_fila de cada vuelta decidida
  pend: null,         // {base, clave, k, d, items, error, enVuelo, envio}: la vuelta abierta (no la original), con los items de bm_fila().datos
  pendVer: 0,         // sube cuando cambia algo que se ve del bloque (datos, marcas, envio): es parte de la firma de pintarDecidido
  swipePref: true,    // el swipe es el unico formato para decidir: el iframe y el bloque quedan solo si el swipe no carga
  homeCat: null,      // categoria abierta en el home cuando tiene 2+ botoneras: se elige en tarjetitas negras
  swd: null,          // datos de la fila abierta para el swipe: {clave, k, d, items, temas, sig, listo, error}
  sw: null,           // el mazo montado: {el, tema, cola, salt, hist, ...}
  hd: {},             // home: clave abierta -> {clave, k, d, items, secs, cat, tanda, listo, error, enVuelo}
  listaCargada: false, // llego al menos una bm_lista
  errores: [],        // fila «Con error» del home: lo que trajo bm_errores_lista (solo los no vistos)
  homeVisto: false    // el home ya completo una primera pasada (despues no vuelve a «Cargando…»)
};
var CLAVE_MARCAS = 'bm-marcas';
estado.marcas = cargarMarcas();
estado.detAbierto = {};   // toggles «Ver el detalle» abiertos de las filas pendientes, por clave|n

/* ---------- utilidades ---------- */
// marcas: localStorage (sobreviven al cierre de la pestana; sin localStorage viven en memoria). Las que la version anterior dejo
// en sessionStorage se migran una vez al primer arranque.
function leerJSON(store, clave){
  try{ var v = JSON.parse(store.getItem(clave) || '{}'); return v && typeof v === 'object' && !Array.isArray(v) ? v : {}; }catch(e){ return {}; }
}
function cargarMarcas(){
  var ls = {}, ss = {};
  try{ ls = leerJSON(localStorage, CLAVE_MARCAS); }catch(e){}
  try{ ss = leerJSON(sessionStorage, CLAVE_MARCAS); }catch(e){}
  var viejas = Object.keys(ss);
  if(viejas.length){
    viejas.forEach(function(c){ if(!ls[c]) ls[c] = ss[c]; });
    try{ localStorage.setItem(CLAVE_MARCAS, JSON.stringify(ls)); sessionStorage.removeItem(CLAVE_MARCAS); }catch(e){}
  }
  return ls;
}
function persistirMarcas(){
  try{ localStorage.setItem(CLAVE_MARCAS, JSON.stringify(estado.marcas)); }catch(e){}
  homePintar();   // los conteos del home siguen a las marcas
}
// una botonera que ya no esta abierta (decidida, aplicada, borrada) deja de guardar marcas
function limpiarMarcas(){
  var abiertas = {}, cambio = false;
  estado.filas.forEach(function(f){ if(f.estado === 'abierta') abiertas[f.clave] = true; });
  Object.keys(estado.marcas).forEach(function(c){ if(!abiertas[c]){ delete estado.marcas[c]; cambio = true; } });
  if(cambio) persistirMarcas();
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
// esc + las URLs https como link que abre afuera
function lnk(s){
  return esc(s).replace(/https:\/\/[^\s<"']+/g, function(u){
    var m = /[).,;:]+$/.exec(u), tail = m ? m[0] : '', url = tail ? u.slice(0, -tail.length) : u;
    return '<a class="lnk" href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + '</a>' + tail;
  });
}
// imagen de lo que se aprueba (un mapa, una maqueta): solo data: URI; si trae link https, abre afuera
// sinLink: en la card del swipe el toque abre el detalle y el arrastre decide; un link ahí se dispararía sin querer
function imagenHTML(it, cls, sinLink){
  var im = it && it.imagen;
  if(!im || typeof im !== 'object' || !/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+\/=]+$/.test(String(im.src || ''))) return '';
  var link = !sinLink && /^https:\/\/[^\s"'<>]+$/.test(String(im.link || '')) ? String(im.link) : '';
  var img = '<img src="' + im.src + '" alt="' + esc(im.alt || '') + '" loading="lazy">';
  return '<div class="' + cls + '">' + (link ? '<a href="' + esc(link) + '" target="_blank" rel="noopener noreferrer">' + img + '</a>' +
    '<a class="afuera" href="' + esc(link) + '" target="_blank" rel="noopener noreferrer">Abrir afuera ↗</a>' : img) + '</div>';
}
function impactoHTML(it, cls){
  var im = it && it.impacto;
  if(!im || typeof im !== 'object' || !(im.positivo || im.negativo)) return '';
  return '<div class="' + cls + '"><div class="pos"><b>Impacto positivo</b>' + esc(im.positivo || 'nada relevante') + '</div>' +
    '<div class="neg"><b>Impacto negativo</b>' + esc(im.negativo || 'nada relevante') + '</div></div>';
}
function fuenteHTML(it, cls){
  if(!it || !it.fuente) return '';
  var f = String(it.fuente);
  return '<p class="' + cls + '"><span>Fuente:</span> ' + (/https:\/\//.test(f) ? lnk(f) : '<code>' + esc(f) + '</code>') + '</p>';
}
function ms(t){ return t ? new Date(t).getTime() : 0; }
function haceCuanto(t){
  if(!t) return '';
  var d = Math.max(0, Date.now() - ms(t));
  var m = Math.round(d / 60000);
  if(m < 1) return 'recién';
  if(m < 60) return 'hace ' + m + ' min';
  var h = Math.round(m / 60);
  if(h < 24) return 'hace ' + h + ' h';
  var dd = Math.round(h / 24);
  return 'hace ' + dd + (dd === 1 ? ' día' : ' días');
}
function hora(t){
  if(!t) return '';
  var d = new Date(t), hoy = new Date();
  var hm = d.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit', hour12:false});
  if(d.toDateString() === hoy.toDateString()) return 'hoy ' + hm;
  return d.toLocaleDateString('es-AR', {day:'2-digit', month:'2-digit'}) + ' ' + hm;
}
// abre la sesion en la app de escritorio de Claude (solo anda en la Mac con la app instalada)
// los bots publican con session_id «bot-<nombre>»: no es una sesion de Claude, no hay link
function urlSesion(id){
  var s = String(id || '');
  // Solo las sesiones de la app de Claude Code (local_<uuid>) tienen un link para abrirlas; otro agente no lleva link.
  return /^local_[A-Za-z0-9_-]+$/.test(s) ? 'claude://claude.ai/epitaxy/' + s : '';
}
// segunda vuelta: una clave «<base>-r2», «<base>-r3»…
function vuelta(clave){
  var m = /^(.*)-r(\d+)$/.exec(String(clave || ''));
  return m ? {base: m[1], n: Number(m[2])} : null;
}
function ordinal(n){ return n + 'ª'; }
function baseDe(clave){ var w = vuelta(clave); return w ? w.base : String(clave || ''); }
function numVuelta(f){ var w = vuelta(f.clave); return w ? w.n : 1; }

// una TANDA = la original (<base>) + sus vueltas (<base>-r2, -r3…). En la lista y en el panel es UNA sola entrada.
// entrada: una fila «virtual» con la clave base. El estado sale de TODAS las vueltas, por prioridad:
// alguna esperando > alguna abierta > alguna decidida/recibida (trabajando) > la ultima (aplicada / respondida_en_chat)
function armarTandas(filas){
  var mapa = {}, lista = [];
  filas.forEach(function(f){
    var b = baseDe(f.clave);
    var t = mapa[b] || (mapa[b] = {base: b, vueltas: []});
    t.vueltas.push(f);
  });
  Object.keys(mapa).forEach(function(b){
    var t = mapa[b];
    t.vueltas.sort(function(x, y){ return numVuelta(x) - numVuelta(y) || ms(x.created_at) - ms(y.created_at); });
    t.baseFila = t.vueltas.filter(function(f){ return f.clave === b; })[0] || null;
    var prim = t.baseFila || t.vueltas[0], ult = t.vueltas[t.vueltas.length - 1];
    t.ultima = ult;
    t.abierta = null;
    t.vueltas.forEach(function(f){ if(f.estado === 'abierta') t.abierta = f; });
    var ab = t.abierta;
    // esperando: la mas reciente. trabajando: una recibida (la mas reciente) o, si no, una decidida
    function ultimaDe(est, campo){
      var r = null;
      t.vueltas.forEach(function(f){
        if(f.estado !== est) return;
        if(!r || (ms(f[campo]) || ms(f.updated_at)) >= (ms(r[campo]) || ms(r.updated_at))) r = f;
      });
      return r;
    }
    t.esperando = ultimaDe('esperando', 'esperando_at');
    t.trabajando = ultimaDe('recibida', 'received_at') || ultimaDe('decidida', 'decided_at');
    var ref = t.esperando || t.trabajando || ult;
    var estT = t.esperando ? 'esperando' : ab ? 'abierta' : t.trabajando ? t.trabajando.estado : ult.estado;
    t.entrada = {
      clave: b, titulo: prim.titulo || b, session_id: prim.session_id, sesion_titulo: prim.sesion_titulo,
      skill: prim.skill, proyecto: prim.proyecto, n_items: prim.n_items,
      estado: estT,
      created_at: (ab || ult).created_at,
      decided_at: ref.decided_at, received_at: ref.received_at, applied_at: ref.applied_at, updated_at: ref.updated_at,
      trab_desde: t.trabajando ? (t.trabajando.received_at || t.trabajando.decided_at || t.trabajando.updated_at) : null,
      trab_recibida: !!t.trabajando && t.trabajando.estado === 'recibida',
      espera_motivo: t.esperando ? t.esperando.espera_motivo : null,
      esperando_at: t.esperando ? t.esperando.esperando_at : null,
      esperando_session: t.esperando ? (t.esperando.session_id || prim.session_id) : null,
      multi: t.vueltas.length > 1,
      pendientes: ab ? (Number(ab.n_items) || 0) : 0,
      decididos: ab && t.vueltas.length > 1 ? Math.max(0, (Number(prim.n_items) || 0) - (Number(ab.n_items) || 0)) : 0
    };
    lista.push(t.entrada);
  });
  return {mapa: mapa, entradas: lista};
}
// cache: se rearma solo cuando cambia el arreglo de filas
function tandas(){
  if(estado.tandasDe !== estado.filas){ estado.tandasDe = estado.filas; estado.tandasVal = armarTandas(estado.filas); }
  return estado.tandasVal;
}
function tandaSel(){ return estado.sel ? (tandas().mapa[estado.sel] || null) : null; }
function itemsTxt(n){ n = Number(n) || 0; return n + (n === 1 ? ' ítem' : ' ítems'); }

/* ---------- agrupado (puro, sin DOM) ---------- */
// arriba: las que te esperan en la conversacion, y despues las tandas con una vuelta abierta (<= 7 dias), por sesion. Lo demas queda abajo.
function agrupar(filas, ahora){
  var abiertas = [], enCurso = [], aplicadas = [], viejas = [], esperan = [];
  armarTandas(filas).entradas.forEach(function(f){
    var edad = ahora - ms(f.created_at);
    if(f.estado === 'esperando'){
      esperan.push(f);
    } else if(f.estado === 'abierta'){
      (edad > SIETE_DIAS ? viejas : abiertas).push(f);
    } else if(f.estado === 'decidida' || f.estado === 'recibida'){
      enCurso.push(f);
    } else if(f.estado === 'aplicada' || f.estado === 'respondida_en_chat'){
      var cuando = ms(f.applied_at) || ms(f.updated_at) || ms(f.created_at);
      if(ahora - cuando <= SIETE_DIAS) aplicadas.push(f);
    }
  });
  var mapa = {};
  abiertas.forEach(function(f){
    var k = f.session_id || '__sin__';
    (mapa[k] = mapa[k] || {key:k, filas:[]}).filas.push(f);
  });
  var grupos = Object.keys(mapa).map(function(k){
    var g = mapa[k];
    g.filas.sort(function(a,b){ return ms(b.created_at) - ms(a.created_at); });
    var reciente = g.filas[0];
    g.titulo = k === '__sin__' ? 'Sin sesión' : (reciente.sesion_titulo || reciente.skill || 'Sesión');
    g.session_id = k === '__sin__' ? null : k;
    g.abiertos = g.filas.reduce(function(s,f){ return s + (Number(f.pendientes) || 0); }, 0);
    g.orden = ms(reciente.created_at);
    return g;
  });
  grupos.sort(function(a,b){ return b.orden - a.orden; });
  enCurso.sort(function(a,b){ return (ms(b.decided_at)||ms(b.updated_at)||ms(b.created_at)) - (ms(a.decided_at)||ms(a.updated_at)||ms(a.created_at)); });
  aplicadas.sort(function(a,b){ return (ms(b.applied_at)||ms(b.updated_at)) - (ms(a.applied_at)||ms(a.updated_at)); });
  viejas.sort(function(a,b){ return ms(b.created_at) - ms(a.created_at); });
  esperan.sort(function(a,b){ return (ms(a.esperando_at)||ms(a.updated_at)) - (ms(b.esperando_at)||ms(b.updated_at)); }); // la que hace mas que espera, primero
  return {esperan:esperan, grupos:grupos, enCurso:enCurso, aplicadas:aplicadas, viejas:viejas};
}
window.__agrupar = agrupar; // solo para pruebas locales

/* ---------- token (localStorage, siempre con try/catch) ---------- */
function leerToken(){ try{ return localStorage.getItem(CLAVE_TOKEN) || null; }catch(e){ return null; } }
function guardarToken(t){ try{ localStorage.setItem(CLAVE_TOKEN, t); }catch(e){} }
function borrarToken(){ try{ localStorage.removeItem(CLAVE_TOKEN); }catch(e){} }
function tokenMalo(err){ return !!(err && /token inv[aá]lido/i.test(String(err.message || err))); }

// token vencido o borrado: se limpia todo y se vuelve a pedir el PIN
function sesionVencida(){
  detenerVivo();
  borrarToken();
  estado.token = null; estado.filas = []; estado.sel = null; estado.vivo = null; estado.orig = null; estado.panelKey = null; estado.decidido = null; estado.pend = null;
  vistaEntrada();
}

/* ---------- pantalla del PIN ---------- */
function vistaEntrada(msg, esErr){
  swipeDesmontar(); estado.swd = null; estado.hd = {}; estado.listaCargada = false; estado.homeVisto = false; estado.homeEnvs = {}; estado.homeEnviando = false; estado.festejo = null;
  raiz.innerHTML =
    '<div class="entrada">' +
      '<h1>Botonera</h1>' +
      '<p>Poné tu PIN.</p>' +
      '<form id="f-pin" autocomplete="off">' +
        '<input class="pin" id="i-pin" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" ' +
          'autocomplete="one-time-code" autocapitalize="off" autocorrect="off" spellcheck="false" ' +
          'aria-label="PIN de 4 dígitos" autofocus>' +
        '<button class="btn primario" type="submit" id="b-pin">Entrar</button>' +
      '</form>' +
      '<div class="aviso' + (esErr ? ' err' : '') + '" id="aviso" role="status">' + esc(msg || '') + '</div>' +
    '</div>';
  var aviso = document.getElementById('aviso');
  var inp = document.getElementById('i-pin');
  var btn = document.getElementById('b-pin');
  var enviando = false;
  function di(t, cls){ aviso.className = 'aviso' + (cls ? ' ' + cls : ''); aviso.textContent = t; }
  function libre(){ enviando = false; inp.disabled = false; btn.disabled = false; inp.value = ''; inp.focus(); }
  function enviar(){
    if(enviando) return;
    var pin = inp.value;
    if(!/^[0-9]{4}$/.test(pin)){ di('Son 4 dígitos.', 'err'); inp.focus(); return; }
    enviando = true; inp.disabled = true; btn.disabled = true; di('');
    sb.rpc('bm_entrar', {p_pin: pin}).then(function(r){
      if(r.error || !r.data){ di('No pude conectar. Probá de nuevo.', 'err'); libre(); return; }
      var d = r.data;
      if(d.ok && d.token){
        guardarToken(d.token);
        estado.token = d.token;
        vistaApp();
        return;
      }
      if(d.motivo === 'pin_incorrecto'){
        var n = Math.max(0, MAX_FALLOS - (Number(d.fallos) || 0));
        di('PIN incorrecto. ' + (n === 1 ? 'Te queda 1 intento.' : 'Te quedan ' + n + ' intentos.'), 'err');
      } else if(d.motivo === 'bloqueado'){
        di('Bloqueado por demasiados intentos. Desbloquealo desde la Mac: pin.py desbloquear', 'err');
      } else if(d.motivo === 'sin_pin'){
        di('Todavía no hay PIN puesto.', 'err');
      } else {
        di('No pude entrar. Probá de nuevo.', 'err');
      }
      libre();
    }, function(){ di('No pude conectar. Probá de nuevo.', 'err'); libre(); });
  }
  inp.addEventListener('input', function(){
    var limpio = inp.value.replace(/[^0-9]/g, '').slice(0, 4);
    if(limpio !== inp.value) inp.value = limpio;
    if(limpio.length === 4) enviar();
  });
  document.getElementById('f-pin').onsubmit = function(e){ e.preventDefault(); enviar(); };
  inp.focus();
}

function salir(){
  var t = estado.token;
  detenerVivo();
  // se borra local primero: aunque bm_salir falle, la pantalla vuelve al PIN
  borrarToken();
  estado.token = null; estado.filas = []; estado.sel = null; estado.vivo = null; estado.orig = null; estado.panelKey = null; estado.decidido = null; estado.pend = null;
  vistaEntrada();
  if(t) sb.rpc('bm_salir', {p_token: t}).then(function(){}, function(){});
}

/* ---------- app ---------- */
function vistaApp(){
  swipeDesmontar(); estado.swd = null; estado.hd = {}; estado.listaCargada = false; estado.homeVisto = false; estado.homeEnvs = {}; estado.homeEnviando = false; estado.festejo = null;
  estado.filas = []; estado.sel = null; estado.vivo = null; estado.orig = null; estado.panelKey = null; estado.decidido = null; estado.pend = null;
  raiz.innerHTML =
    '<div class="top"><h1>Botonera</h1>' +
      '<button class="btn" id="b-salir">Salir</button></div>' +
    '<div class="app">' +
      '<div class="lista" id="lista"><div class="home" id="home"></div></div>' +
      '<div class="panel" id="panel"></div>' +
    '</div>';
  document.getElementById('b-salir').onclick = salir;
  avisosAlEntrar();
  // solo cards: «?c=<clave>» ya no abre el panel de la tanda; abre su mazo si le quedan cards, si no queda el home
  var q = new URLSearchParams(location.search).get('c');
  estado.abrirClave = q ? baseDe(q) : null; // «?c=<base>-r2» abre la tanda de la base
  if(q){ try{ history.replaceState(null, '', location.pathname); }catch(e){} }
  document.getElementById('home').addEventListener('click', alClickHome);
  pintarPanel(true);
  cargarLista().then(function(){
    if(!estado.token) return; // el token no valia: ya se volvio al PIN
    arrancarVivo();
  });
}

function cargarLista(){
  var token = estado.token;
  if(!token) return Promise.resolve();
  return sb.rpc('bm_lista', {p_token: token})
    .then(function(r){
      if(token !== estado.token) return; // salio o cambio de sesion mientras tanto
      if(r.error){
        if(tokenMalo(r.error)) sesionVencida(); else console.warn('lista', r.error);
        return;
      }
      estado.filas = r.data || [];
      estado.listaCargada = true;
      limpiarMarcas();
      pintarLista();
      homeCargar();
      cargarErrores();
      homePintar();
      pintarPanel(false);
    }, function(err){ console.warn('lista', err); });
}

function itemHTML(f, conSesion){
  var cls = 'item' + (f.clave === estado.sel ? ' sel' : '');
  var pillEst = '';
  if(f.estado === 'decidida' || f.estado === 'recibida') pillEst = trabajandoHTML(f);
  else if(f.estado === 'esperando') pillEst = '<span class="pill warn">te espera</span>';
  else if(f.estado === 'aplicada') pillEst = '<span class="pill go">aplicada</span>';
  else if(f.estado === 'respondida_en_chat') pillEst = '<span class="pill go">en el chat</span>';
  var chips;
  if(f.estado === 'abierta' && f.multi){
    chips = '<span class="pill warn">' + f.pendientes + ' por decidir</span>' +
      '<span class="pill mudo">' + f.decididos + (f.decididos === 1 ? ' decidido' : ' decididos') + '</span>';
  } else {
    chips = '<span class="pill mudo">' + esc(itemsTxt(f.n_items)) + '</span>' + pillEst;
  }
  var ses = conSesion ? '<span>' + esc(f.sesion_titulo || f.skill || 'Sin sesión') + '</span>' : '';
  // en curso el «hace N min» ya va dentro del indicador; esperando cuenta desde que quedo esperando
  var cuando = (f.estado === 'decidida' || f.estado === 'recibida') ? '' : '<span>' + esc(haceCuanto(f.estado === 'esperando' ? (f.esperando_at || f.updated_at) : f.created_at)) + '</span>';
  var btn = '<button class="' + cls + '" data-c="' + esc(f.clave) + '">' +
    '<div class="t">' + esc(f.titulo || f.clave) + '</div>' +
    '<div class="m">' + chips + cuando + ses + '</div>' +
    (f.estado === 'esperando' && f.espera_motivo ? '<div class="espera-m">' + esc(f.espera_motivo) + '</div>' : '') + '</button>';
  if(f.estado !== 'esperando') return btn;
  // el link va afuera del boton (un <a> dentro de un <button> no es valido)
  var url = urlSesion(f.esperando_session || f.session_id);
  return '<div class="espw' + (f.clave === estado.sel ? ' sel' : '') + '">' + btn +
    (url ? '<a class="lnk-ses" href="' + esc(url) + '">Abrir la conversación ↗</a>' : '') + '</div>';
}
// «Claude trabajando · hace N min»; con mas de 30 min en recibida pasa a «Trabajando hace N min» en tono warning
var TREINTA_MIN = 30 * 60000;
function trabajoLargo(f){ return !!f.trab_recibida && (Date.now() - ms(f.trab_desde)) > TREINTA_MIN; }
function trabajandoHTML(f){
  var largo = trabajoLargo(f), hc = haceCuanto(f.trab_desde || f.decided_at);
  return '<span class="trab' + (largo ? ' largo' : '') + '"><i class="pulso" aria-hidden="true"></i>' +
    esc(largo ? 'Trabajando ' + hc : 'Claude trabajando' + (hc ? ' · ' + hc : '')) + '</span>';
}

function pintarLista(){
  var el = document.getElementById('blista'); if(!el) return;
  var ag = agrupar(estado.filas, Date.now());
  var h = '<div class="h-tit">Botoneras</div>';
  if(ag.esperan.length){
    h += '<div class="grupo"><div class="grupo-h"><span class="t">Te esperan en la conversación</span>' +
      '<span class="pill warn">' + ag.esperan.length + '</span></div>';
    ag.esperan.forEach(function(f){ h += itemHTML(f, false); });
    h += '</div>';
  }
  if(!ag.grupos.length && !ag.esperan.length){
    h += '<div class="vacio">No hay nada por decidir.</div>';
  }
  ag.grupos.forEach(function(g){
    var url = urlSesion(g.session_id);
    h += '<div class="grupo"><div class="grupo-h"><span class="t">' + esc(g.titulo) + '</span>' +
      (url ? '<a class="lnk-ses chico" href="' + esc(url) + '" title="Abrir la conversación" aria-label="Abrir la conversación">↗</a>' : '') +
      (g.abiertos ? '<span class="pill">' + g.abiertos + '</span>' : '') + '</div>';
    g.filas.forEach(function(f){ h += itemHTML(f, false); });
    h += '</div>';
  });
  // lo que ya no falta decidir va abajo, plegado
  function plegable(k, titulo, filas){
    if(!filas.length) return '';
    var d = '<details class="plegable" data-k="' + k + '"><summary>' + titulo + ' <span class="pill mudo">' + filas.length + '</span></summary>';
    filas.forEach(function(f){ d += itemHTML(f, true); });
    return d + '</details>';
  }
  var listas = {encurso: ag.enCurso, aplicadas: ag.aplicadas, viejas: ag.viejas};
  h += plegable('encurso', 'En curso', ag.enCurso);
  h += plegable('aplicadas', 'Aplicadas esta semana', ag.aplicadas);
  h += plegable('viejas', 'Viejas', ag.viejas);
  // conservar lo que dejo la persona (por data-k, no por posicion); sin decision suya, abre solo el que tiene la seleccionada
  Array.prototype.forEach.call(el.querySelectorAll('details'), function(d){ estado.abiertos[d.getAttribute('data-k')] = d.open; });
  el.innerHTML = h;
  Array.prototype.forEach.call(el.querySelectorAll('details'), function(d){
    var k = d.getAttribute('data-k');
    // «En curso» abre solo: es donde se ve que Claude esta trabajando
    d.open = (k in estado.abiertos) ? estado.abiertos[k] : (k === 'encurso' || contiene(listas[k] || []));
  });
  Array.prototype.forEach.call(el.querySelectorAll('.item'), function(b){
    b.onclick = function(){ elegir(b.getAttribute('data-c')); };
  });
  // el link no elige la botonera
  Array.prototype.forEach.call(el.querySelectorAll('.lnk-ses'), function(a){
    a.onclick = function(e){ e.stopPropagation(); };
  });
}
function contiene(arr){ return arr.some(function(f){ return f.clave === estado.sel; }); }

function elegir(clave){
  clave = baseDe(clave); // la tanda se identifica por la clave base
  var cambio = clave !== estado.sel;
  estado.sel = clave;
  try{ history.replaceState(null, '', location.pathname + '?c=' + encodeURIComponent(clave)); }catch(e){}
  pintarLista();
  pintarPanel(cambio);
  irAlPanel();
}
function irAlPanel(){
  if(!window.matchMedia('(max-width: 859px)').matches) return;
  window.scrollTo(0, 0);
}
function volverALista(){
  estado.sel = null;
  try{ history.replaceState(null, '', location.pathname); }catch(e){}

}

/* ---------- panel ---------- */
function paso(nombre, t, saltado){
  var h = t ? esc(hora(t)) : (saltado ? '—' : 'Pendiente');
  return '<div class="paso' + (t ? ' hecho' : '') + '"><div class="n">' + esc(nombre) + '</div><div class="h">' + h + '</div></div>';
}
// un paso sin fecha con uno posterior hecho no esta «pendiente»: se salteo o no se registro
// modo: 'trab' (Claude trabajando) o 'espera' (la pelota la tiene el usuario): cambian solo el paso «Aplicado»
function pasosHTML(f, modo, largo){
  var ps = [['Decidido', f.decided_at], ['Llegó a la sesión', f.received_at], ['Aplicado', f.applied_at]];
  return ps.map(function(p, i){
    if(i === 2 && modo === 'trab' && !p[1]){
      return '<div class="paso trab-p' + (largo ? ' largo' : '') + '"><div class="n">Aplicado</div><div class="h"><span class="trab' + (largo ? ' largo' : '') + '"><i class="pulso" aria-hidden="true"></i>Trabajando…</span></div></div>';
    }
    if(i === 2 && modo === 'espera' && !p[1]){
      return '<div class="paso espera-p"><div class="n">Aplicado</div><div class="h">Te espera</div></div>';
    }
    var posterior = ps.slice(i + 1).some(function(q){ return q[1]; });
    return paso(p[0], p[1], posterior);
  }).join('');
}
function esperaHTML(f){
  var url = urlSesion(f.esperando_session || f.session_id);
  var cuando = haceCuanto(f.esperando_at || f.updated_at);
  return '<div class="espera-blq"><div class="et">Te espera en la conversación</div>' +
    (f.espera_motivo ? '<div class="em">' + esc(f.espera_motivo) + '</div>' : '') +
    '<div class="ef">' + (url ? '<a class="lnk-ses" href="' + esc(url) + '">Abrir la conversación ↗</a>' : '') +
    (cuando ? '<span>' + esc(cuando) + '</span>' : '') + '</div></div>';
}

function cabeceraHTML(t){
  var f = t.entrada, meta = [];
  // la tira sigue la prioridad de la tanda: esperando > abierta > trabajando > ultima vuelta
  // con una vuelta abierta el estado de la cabecera es el de la ultima vuelta DECIDIDA, no el «Pendiente» de la abierta
  var fp = f, modo = null;
  if(t.esperando){ fp = t.esperando; modo = 'espera'; }
  else if(t.abierta){ if(t.abierta.clave !== t.base){ var vd = vueltasDecididas(t); if(vd.length) fp = vd[vd.length - 1]; } }
  else if(t.trabajando){ fp = t.trabajando; modo = 'trab'; }
  var url = urlSesion(f.session_id);
  var link = url ? ' <a class="lnk-ses" href="' + esc(url) + '">Abrir la conversación ↗</a>' : '';
  if(f.sesion_titulo) meta.push('Sesión <b>' + esc(f.sesion_titulo) + '</b>' + link);
  else if(link) meta.push(link.trim());
  if(f.skill) meta.push('Skill <b>' + esc(f.skill) + '</b>');
  if(f.proyecto) meta.push('Proyecto <b>' + esc(f.proyecto) + '</b>');
  meta.push(esc(itemsTxt(f.n_items)));
  meta.push('Creada ' + esc(hora((t.baseFila || t.vueltas[0]).created_at)));
  return '<div class="cab"><h2>' + esc(f.titulo || f.clave) + '</h2><div class="meta">' +
    meta.map(function(m){ return '<span>' + m + '</span>'; }).join('') + '</div>' +
    '<div class="pasos">' + pasosHTML(fp, modo, modo === 'trab' && trabajoLargo(f)) + '</div></div>' +
    (t.esperando ? esperaHTML(f) : '');
}

/* ---------- «Lo que decidiste»: la respuesta guardada, en lectura ---------- */
// respuesta_texto: una linea por item «N. marca · titulo → accion [· comentario: …]» + una linea «Notas: …» opcional
// una marca que no se liste aca se pega como comentario del item anterior
var RE_LINEA = /^(\d+)\.\s*(no va|va con cambios|va|sin marcar|comentario|después|no entiendo|ya está hecho|eligió [^·]*?)\s*·\s*(.*)$/i;
function marcaVa(m){ return m === 'va' || m === 'va con cambios' || /^eligió /.test(m); }
function marcaAbierta(m){ return m === 'sin marcar' || m === 'comentario'; } // comentar no decide: la card sigue abierta
function parsearRespuesta(txt){
  var items = [], notas = [], ultimo = null, enNota = false;
  String(txt).split(/\r?\n/).forEach(function(raw){
    var l = raw.trim(); if(!l) return;
    var m = RE_LINEA.exec(l);
    if(m){
      var resto = m[3], coment = '', campos = '';
      var k = resto.search(/\s*·\s*comentario:\s*/i);
      if(k >= 0){ coment = resto.slice(k).replace(/^\s*·\s*comentario:\s*/i, ''); resto = resto.slice(0, k); }
      var kc = resto.search(/\s*·\s*campos:\s*/i);   // Editar: «· campos: id=nuevo (antes viejo); …», entre la acción y el comentario
      if(kc >= 0){ campos = resto.slice(kc).replace(/^\s*·\s*campos:\s*/i, ''); resto = resto.slice(0, kc); }
      var j = resto.indexOf(' → ');
      ultimo = {n: m[1], marca: m[2].toLowerCase(), titulo: (j >= 0 ? resto.slice(0, j) : resto).trim(),
                accion: j >= 0 ? resto.slice(j + 3).trim() : '', campos: campos.trim(), comentario: coment.trim()};
      items.push(ultimo); enNota = false; return;
    }
    var n = /^Notas:\s*(.*)$/i.exec(l);
    if(n){ notas.push(n[1]); enNota = true; return; }
    if(/^\/botonera respuesta/i.test(l)) return;
    // linea suelta: sigue a lo anterior (notas o comentario del ultimo item)
    if(enNota) notas.push(l);
    else if(ultimo) ultimo.comentario = (ultimo.comentario ? ultimo.comentario + ' ' : '') + l;
  });
  return {items: items, notas: notas.join('\n').trim(), crudo: String(txt)};
}

function lineasHTML(txt){
  return String(txt).split(/\r?\n/).filter(function(l){ return l.trim(); })
    .map(function(l){ return '<div class="l">' + esc(l) + '</div>'; }).join('');
}

// una vuelta abierta: sus items vienen en bm_fila().datos (el JSON de la tanda). Se lee con la forma validada.
function introVueltaHTML(d){
  var dat = d && d.datos;
  if(typeof dat === 'string'){ try{ dat = JSON.parse(dat); }catch(e){ dat = null; } }
  var bs = dat && Array.isArray(dat.intro) ? dat.intro : [];
  return bs.map(function(b){
    if(!b || typeof b !== 'object') return '';
    return '<div class="p-intro">' + (b.titulo ? '<b>' + esc(b.titulo) + '</b>' : '') +
      (b.texto ? '<p>' + lnk(b.texto) + '</p>' : '') +
      (Array.isArray(b.items) ? '<ul>' + b.items.map(function(x){ return '<li>' + lnk(x) + '</li>'; }).join('') + '</ul>' : '') + '</div>';
  }).join('');
}
function itemsDeVuelta(d){
  var dat = d && d.datos;
  if(typeof dat === 'string'){ try{ dat = JSON.parse(dat); }catch(e){ dat = null; } }
  var its = dat && Array.isArray(dat.items) ? dat.items : [];
  return its.filter(function(it){ return it && typeof it === 'object' && it.titulo != null; })
    .map(function(it, i){ if(it.n == null || it.n === '') it.n = i + 1; return it; });
}
function recoVa(it){ return /^va$/i.test(String(it.reco || '').trim()); }
// marcas en curso de la vuelta: {items:{n:{m:'go'|'no'|'', c}}, notas}, en memoria + localStorage por clave de la vuelta
// go/no de siempre; vc (va con cambios), de (después) y op (eligió, con o = ids). ne/yh (no entiendo, ya está hecho) quedan de las maquetas
var MARCAS = {go: 1, no: 1, vc: 1, ne: 1, yh: 1, de: 1, op: 1, co: 1};
function marcaDe(clave, n){
  var mk = estado.marcas[clave], v = mk && mk.items && mk.items[n];
  var r = {m: v && MARCAS[v.m] ? v.m : '', c: v && typeof v.c === 'string' ? v.c : ''};
  if(v && Array.isArray(v.o)) r.o = v.o.filter(function(x){ return typeof x === 'string'; });
  if(v && v.f && typeof v.f === 'object' && !Array.isArray(v.f)) r.f = v.f;   // Editar: {id del campo: valor nuevo}, solo los que cambiaron
  return r;
}
function setMarca(clave, n, campo, valor){
  var mk = estado.marcas[clave];
  if(!mk || typeof mk !== 'object' || !mk.items || typeof mk.items !== 'object') mk = estado.marcas[clave] = {items: {}, notas: ''};
  var cur = marcaDe(clave, n); cur[campo] = valor;
  mk.items[n] = cur;
  guardarMarcas({clave: clave, marcas: mk});
}
// el texto de la respuesta: el MISMO formato que respuesta() de la plantilla, con la clave y los n/titulos de la VUELTA
function respuestaVuelta(p){
  var L = ['/botonera respuesta · ' + p.clave];
  p.items.forEach(function(it){
    var st = marcaDe(p.clave, it.n), ids = st.m === 'op' ? (st.o || []) : [];
    // Editar guarda los campos al escribir: un Va (botón, swipe o flecha) con cambios sin confirmar sale como «va con cambios» (no se pierden)
    var cf = st.m === 'go' || st.m === 'vc' || st.m === 'op' ? mqCamposTxt(it, st.f) : '';
    if(st.m === 'go' && cf) st.m = 'vc';
    var m = st.m === 'go' ? 'va' : st.m === 'no' ? 'no va' : st.m === 'vc' ? 'va con cambios' : st.m === 'ne' ? 'no entiendo' :
      st.m === 'yh' ? 'ya está hecho' : st.m === 'de' ? 'después' : st.m === 'co' ? 'comentario' : st.m === 'op' ? 'eligió ' + ids.join(', ') : 'sin marcar';
    var acc = st.m === 'go' || st.m === 'vc' ? it.accion_va : st.m === 'no' ? it.accion_no_va : st.m === 'op' ? ids.map(function(id){ return mqEtiqueta(it, id); }).join(', ') : '';
    L.push(it.n + '. ' + m + ' · ' + it.titulo + (acc ? ' → ' + acc : '') + (cf ? ' · campos: ' + cf : '') + (st.c && st.c.trim() ? ' · comentario: ' + st.c.trim() : ''));
  });
  return L.join('\n');
}
window.__respuestaVuelta = function(){ // solo para pruebas locales: la vuelta abierta en el bloque o, con el swipe prendido, la fila abierta del swipe
  var p = estado.pend, s = estado.swd;
  if(p && p.d) return respuestaVuelta(p);
  return s && s.d && s.items.length ? respuestaVuelta({clave: s.clave, items: s.items}) : null;
};

// fila pendiente ACTIVA: el mismo layout que una decidida, con contexto, antecedentes, recomendacion, 2 botones y comentario
function pendActivaHTML(it, nShow, clave, bloq){
  var st = marcaDe(clave, it.n), tieneReco = !!String(it.reco || '').trim(), va = recoVa(it);
  var accVa = it.accion_va || 'Va', accNo = it.accion_no_va || 'No va';
  var sel = st.m === 'go' ? accVa : st.m === 'no' ? accNo : '';
  var an = Array.isArray(it.antecedentes) ? it.antecedentes.slice(0, 3) : [];
  var n = esc(it.n), dis = bloq ? ' disabled' : '';
  var tags = swVence(it.vence) + acentoTag(it);
  var h = '<div class="dec-fila pend"><span class="dec-n">' + esc(nShow) + '</span><div class="dec-x">' + (tags ? '<div class="p-tags">' + tags + '</div>' : '') + '<div>' + esc(it.titulo) + '</div>' +
    (sel ? '<div class="a">→ ' + esc(sel) + '</div>' : '') +
    (it.contexto ? '<div class="p-ctx">' + lnk(it.contexto) + '</div>' : '') + swDibujo(it, 'p-dib') + swIcono(it, 'p-ico') + imagenHTML(it, 'p-img');
  if(an.length || it.si_no_decidis){
    h += '<div class="p-antec">' +
      (an.length ? '<b>Qué pasó hasta acá</b><ul>' + an.map(function(x){ return '<li>' + lnk(x) + '</li>'; }).join('') + '</ul>' : '') +
      (it.si_no_decidis ? '<div class="snd"><b>Si no decidís:</b> ' + esc(it.si_no_decidis) + '</div>' : '') + '</div>';
  }
  if(tieneReco){
    h += '<div class="p-reco">Te recomiendo: <b class="' + (va ? 'r-go' : 'r-no') + '">' + esc(va ? accVa : accNo) + '</b>' +
      (it.reco_motivo ? ' · ' + esc(it.reco_motivo) : '') + '</div>';
  }
  // No va a la izquierda y Va a la derecha, como en el swipe: la recomendada (Va) queda siempre a la derecha
  h += '<div class="p-acc">' +
    '<button type="button" class="pb no' + (tieneReco && !va ? ' rec' : '') + (st.m === 'no' ? ' on' : '') + '" data-pm="no" data-pn="' + n + '"' + dis + '>' + esc(accNo) + '</button>' +
    '<button type="button" class="pb go' + (tieneReco && va ? ' rec' : '') + (st.m === 'go' ? ' on' : '') + '" data-pm="go" data-pn="' + n + '"' + dis + '>' + esc(accVa) + '</button></div>' +
    '<input type="text" class="pcom" data-pn="' + n + '" placeholder="Comentario" aria-label="Comentario" autocomplete="off" value="' + esc(st.c) + '"' + dis + '>';
  // jerarquía: primero de qué va (título, contexto, imagen, recomendación); el detalle, si lo busca
  function fila(rot, v){ return v ? '<p class="p-fte"><span>' + rot + ':</span> ' + lnk(v) + '</p>' : ''; }
  var det = impactoHTML(it, 'p-imp') + fila('Por qué', it.porque) + fila('Si va', it.si_va) + fila('Si no va', it.si_no_va) + fuenteHTML(it, 'p-fte');
  var kd = clave + '|' + it.n;
  if(det) h += '<details class="p-det" data-det="' + esc(kd) + '"' + (estado.detAbierto[kd] ? ' open' : '') + '><summary>Ver el detalle</summary>' + det + '</details>';
  return h + '</div></div>';
}
// fila pendiente SIN vuelta abierta: en lectura, sin botones
function pendLecturaHTML(it){
  return '<div class="dec-fila pend"><span class="dec-n">' + esc(it.n) + '</span><div class="dec-x"><div>' + esc(it.titulo) + '</div>' +
