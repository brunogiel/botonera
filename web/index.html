    (it.comentario ? '<div class="c"><b>Comentario:</b> ' + esc(it.comentario) + '</div>' : '') + '</div></div>';
}
function barraPendHTML(p, sinMarcar){
  var env = p.envio || {}, bloq = env.st === 'enviando' || env.st === 'ok';
  var lbl = env.st === 'enviando' ? 'Enviando…' : env.st === 'ok' ? 'Enviado ✓' : 'Enviar';
  return '<div class="p-bar"><span class="cnt">' + (sinMarcar ? sinMarcar + ' sin marcar' : 'Todo marcado') + '</span>' +
    '<button type="button" class="btn primario" data-envio="1"' + (bloq ? ' disabled' : '') + '>' + lbl + '</button>' +
    (env.st === 'error' && env.msg ? '<div class="p-msg" role="status">' + esc(env.msg) + '</div>' : '') + '</div>';
}

// junta las vueltas ya decididas (en orden): un item aparece UNA vez, con lo ultimo que se decidio de el (match por titulo exacto)
function juntarVueltas(parsed){
  var todos = [];
  parsed.forEach(function(x, vi){
    x.p.items.forEach(function(it){
      var marcado = !marcaAbierta(it.marca), e = null;
      for(var i = 0; i < todos.length; i++){
        if(todos[i].vi < vi && todos[i].it.titulo === it.titulo){ e = todos[i]; break; }
      }
      if(e){
        if(!marcaAbierta(e.it.marca) && !marcado) return; // ya estaba decidido: un «sin marcar» o un comentario posterior no lo pisa
        var n = e.it.n; e.vi = vi; e.it = it; it.n = n;      // hereda el numero de la botonera donde nacio
        return;
      }
      if(vi > 0) it.n = ''; // item nuevo de una vuelta: su numero local chocaria con los de la original
      todos.push({vi: vi, it: it});
    });
  });
  var its = todos.map(function(x){ return x.it; });
  return {
    decididos: its.filter(function(it){ return !marcaAbierta(it.marca); }),
    faltan: its.filter(function(it){ return marcaAbierta(it.marca); })
  };
}

function vueltasDecididas(t){ return t.vueltas.filter(function(v){ return v.estado !== 'abierta'; }); }
function llaveFila(v){ return v.clave + '|' + v.estado + '|' + v.updated_at; }

// UN solo bloque: arriba lo pendiente (filas activas si hay una vuelta abierta; en lectura si no), abajo lo decidido.
// pend = estado.pend de la vuelta abierta (ya cargado), o null
function decididoHTML(t, datos, pend){
  var h = '', vs = vueltasDecididas(t), parsed = [], resumenes = [], notas = [];
  vs.forEach(function(v){
    var dd = datos[v.clave], d = dd && dd.d; if(!d) return;
    var rot = vs.length > 1 ? ' · ' + ordinal(numVuelta(v)) + ' vuelta' : '';
    var txt = d.respuesta_texto;
    if(txt != null && String(txt).trim()){
      var p = parsearRespuesta(txt);
      parsed.push({v: v, p: p});
      if(p.notas) notas.push({rot: rot, txt: p.notas});
    }
    if(d.resumen_aplicado && String(d.resumen_aplicado).trim()) resumenes.push({rot: rot, txt: d.resumen_aplicado});
  });
  var j = parsed.length ? juntarVueltas(parsed) : {decididos: [], faltan: []};
  var decididos = j.decididos;
  // primero los va, despues los no va (estable: dentro de cada grupo queda el orden original)
  decididos = decididos.filter(function(it){ return marcaVa(it.marca); })
    .concat(decididos.filter(function(it){ return !marcaVa(it.marca); }));
  var conItems = parsed.some(function(x){ return x.p.items.length; });
  var activa = !!pend;                               // hay una vuelta abierta con sus items cargados
  var nPend = activa ? pend.items.length : j.faltan.length;
  var url = urlSesion(t.entrada.session_id);

  h += '<div class="dec"><div class="dec-t">' + (nPend ? 'Por decidir (' + nPend + ')' : 'Lo que decidiste') + '</div>';
  var sub = [];
  if(nPend) sub.push(nPend + ' por decidir');
  if(conItems){
    var c = {va: 0, 'no va': 0};
    decididos.forEach(function(it){ if(marcaVa(it.marca)) c.va++; else if(it.marca === 'no va') c['no va']++; });
    sub.push(c.va + ' va', c['no va'] + ' no va');
  }
  if(sub.length) h += '<div class="dec-sub">' + sub.join(' · ') + '</div>';

  // --- lo pendiente, arriba
  if(activa){
    h += introVueltaHTML(pend.d);
    // el numero es el de la tanda ORIGINAL: se matchea el titulo con el del item sin marcar de la base; si no matchea, el de la vuelta
    var usados = {};
    var bloq = !!pend.envio && (pend.envio.st === 'enviando' || pend.envio.st === 'ok');
    var sinMarcar = 0;
    pend.items.forEach(function(it){
      var nShow = it.n;
      for(var i = 0; i < j.faltan.length; i++){
        if(!usados[i] && j.faltan[i].titulo === it.titulo && j.faltan[i].n !== ''){ usados[i] = true; nShow = j.faltan[i].n; break; }
      }
      if(!marcaDe(pend.clave, it.n).m) sinMarcar++;
      h += pendActivaHTML(it, nShow, pend.clave, bloq);
    });
    h += barraPendHTML(pend, sinMarcar);
  } else if(j.faltan.length){
    j.faltan.forEach(function(it){ h += pendLecturaHTML(it); });
    h += '<div class="p-sub">La sesión te los vuelve a traer.' +
      (url ? '<a class="lnk-ses" href="' + esc(url) + '">Abrir la conversación ↗</a>' : '') + '</div>';
  }

  // --- lo decidido, abajo
  if(!parsed.length){
    if(!nPend){
      var ult = vs[vs.length - 1];
      h += '<div class="dec-vacio">' + (ult && ult.estado === 'respondida_en_chat' ? 'La respondiste en el chat.' : 'No hay una respuesta guardada.') + '</div>';
    }
  } else if(conItems){
    if(!decididos.length && !nPend) h += '<div class="dec-vacio">Todavía no decidiste ninguno.</div>';
    decididos.forEach(function(it){
      var cls = marcaVa(it.marca) ? 'go' : it.marca === 'no va' ? 'no' : 'mudo';
      h += '<div class="dec-fila"><span class="dec-n">' + esc(it.n) + '</span>' +
        '<span class="pill ' + cls + '">' + esc(/^eligió /.test(it.marca) ? 'eligió' : it.marca === 'después' ? 'al inbox' : it.marca) + '</span>' +
        '<div class="dec-x"><div>' + esc(it.titulo) + '</div>' +
        (it.accion ? '<div class="a">→ ' + esc(it.accion) + '</div>' : '') +
        (it.campos ? '<div class="c"><b>Cambios:</b> ' + esc(it.campos) + '</div>' : '') +
        (it.comentario ? '<div class="c"><b>Comentario:</b> ' + esc(it.comentario) + '</div>' : '') +
        '</div></div>';
    });
  } else {
    // formato que no se reconoce: se muestra tal cual
    h += '<div class="dec-txt">' + parsed.map(function(x){ return lineasHTML(x.p.crudo); }).join('') + '</div>';
  }
  notas.forEach(function(n){
    h += '<div class="dec-sec"><div class="dec-t">Notas' + esc(n.rot) + '</div><div class="dec-txt">' + lineasHTML(n.txt) + '</div></div>';
  });
  h += '</div>';
  resumenes.forEach(function(r){
    h += '<div class="dec"><div class="dec-t">Qué hizo la sesión' + esc(r.rot) + '</div><div class="dec-txt">' + lineasHTML(r.txt) + '</div></div>';
  });
  return h;
}

// la vuelta abierta (si la hay y NO es la original) con sus items ya cargados; si no, null
function pendVigente(){
  var t = tandaSel(), ab = t && t.abierta, p = estado.pend;
  if(!ab || ab.clave === t.base || !p || p.clave !== ab.clave || !p.d) return null;
  return p;
}

function pintarDecidido(forzar){
  var el = document.getElementById('dec'), dd = estado.decidido, t = tandaSel();
  if(!el || !dd || !t || dd.base !== t.base) return;
  var ab = t.abierta, vuelta = !!ab && ab.clave !== t.base;
  var p = vuelta && estado.pend && estado.pend.clave === ab.clave ? estado.pend : null;
  var vs = vueltasDecididas(t);
  var listo = vs.every(function(v){ return dd.datos[v.clave] && dd.datos[v.clave].d; }) && (!vuelta || !!(p && p.d));
  var sig = [listo ? 1 : 0, dd.error ? 1 : 0, p && p.error ? 1 : 0,
    vs.map(function(v){ return dd.datos[v.clave] ? dd.datos[v.clave].k : '-'; }).join(','),
    vuelta ? llaveFila(ab) : '', p ? p.k : '', estado.pendVer, t.entrada.session_id || ''].join('|');
  if(el.getAttribute('data-sig') === sig) return; // sin cambios: no se repinta (no se pierde el foco ni lo que se escribe)
  // escribiendo un comentario: no se le pisa el campo; se reintenta en el proximo refresco
  var af = document.activeElement;
  if(!forzar && af && af.classList && af.classList.contains('pcom') && el.contains(af)) return;
  var h;
  if(listo) h = decididoHTML(t, dd.datos, vuelta ? p : null);
  else if(dd.error || (p && p.error)) h = '<div class="dec"><div class="dec-vacio">No pude traer lo que falta decidir y lo que decidiste. Se reintenta solo.</div></div>';
  else h = '<div class="dec"><div class="dec-vacio">Cargando…</div></div>';
  el.setAttribute('data-sig', sig);
  el.innerHTML = h;
}
function pendCambio(){ estado.pendVer++; pintarDecidido(true); }

function alClickDec(e){
  var tg = e.target; if(!tg || !tg.closest) return;
  var b = tg.closest('[data-pm]');
  if(b){
    var p = pendVigente(); if(!p || (p.envio && (p.envio.st === 'enviando' || p.envio.st === 'ok'))) return;
    var n = b.getAttribute('data-pn'), m = b.getAttribute('data-pm');
    setMarca(p.clave, n, 'm', marcaDe(p.clave, n).m === m ? '' : m);
    pendCambio();
    return;
  }
  if(tg.closest('[data-envio]')) enviarVuelta();
}
function alInputDec(e){
  var i = e.target;
  if(!i || !i.classList || !i.classList.contains('pcom')) return;
  var p = pendVigente(); if(!p) return;
  setMarca(p.clave, i.getAttribute('data-pn'), 'c', i.value);
}

// manda la respuesta de la vuelta abierta: bm_decidir_pin con la clave de la VUELTA y su updated_at
function enviarVuelta(){
  var p = pendVigente(); if(!p) return;
  var clave = p.clave;
  if(estado.bloqueadas[clave]) return;
  var token = estado.token; if(!token) return;
  estado.bloqueadas[clave] = true;
  p.envio = {st: 'enviando', msg: ''}; pendCambio();
  function falla(msg){ estado.bloqueadas[clave] = false; p.envio = {st: 'error', msg: msg}; pendCambio(); }
  sb.rpc('bm_decidir_pin', {p_token: token, p_clave: clave, p_respuesta: respuestaVuelta(p), p_version: p.d.updated_at || null})
    .then(function(r){
      estado.bloqueadas[clave] = false;
      if(token !== estado.token) return;
      if(r.error && tokenMalo(r.error)){ sesionVencida(); return; }
      if(r.error){ falla(r.error.message || 'No se pudo enviar'); return; }
      if(r.data === 'decidida'){
        p.envio = {st: 'ok', msg: ''}; pendCambio();
        cargarLista().then(function(){ delete estado.marcas[clave]; persistirMarcas(); });
      } else if(r.data === 'cambio'){
        p.envio = {st: 'error', msg: 'La tanda cambió mientras decidías.'}; p.k = null; pendCambio();
        cargarLista().then(function(){ var tt = tandaSel(); if(tt) sincronizarPend(tt); });
      } else {
        p.envio = {st: 'error', msg: 'Ya estaba ' + r.data}; pendCambio(); cargarLista();
      }
    }, function(err){ if(token === estado.token) falla((err && err.message) || 'No se pudo enviar'); });
}

// trae respuesta_texto y resumen_aplicado (bm_fila) de cada vuelta decidida, una vez por clave+estado+updated_at
function sincronizarDecidido(t){
  var dd = estado.decidido;
  if(!dd || dd.base !== t.base) dd = estado.decidido = {base: t.base, datos: {}, error: false, enVuelo: {}};
  var token = estado.token; if(!token) return;
  vueltasDecididas(t).forEach(function(v){
    var k = llaveFila(v), cur = dd.datos[v.clave];
    if((cur && cur.k === k) || dd.enVuelo[v.clave] === k) return;
    dd.enVuelo[v.clave] = k;
    function suelto(){ if(dd.enVuelo[v.clave] === k) delete dd.enVuelo[v.clave]; }
    sb.rpc('bm_fila', {p_token: token, p_clave: v.clave}).then(function(r){
      if(token !== estado.token) return;
      if(r.error && tokenMalo(r.error)){ sesionVencida(); return; }
      if(estado.decidido !== dd) return; // cambio la seleccion mientras tanto
      suelto();
      var d = Array.isArray(r.data) ? r.data[0] : r.data;
      if(r.error || !d){ console.warn('decidido', r.error); dd.error = true; }
      else { dd.datos[v.clave] = {k: k, d: d}; dd.error = false; }
      pintarDecidido();
    }, function(err){
      suelto();
      if(estado.decidido === dd){ console.warn('decidido', err); dd.error = true; pintarDecidido(); }
    });
  });
}

// trae los items de la vuelta abierta (bm_fila → datos), una vez por clave+estado+updated_at
function sincronizarPend(t){
  var ab = t.abierta;
  if(!ab || ab.clave === t.base){ estado.pend = null; return; }
  var token = estado.token; if(!token) return;
  var k = llaveFila(ab), p = estado.pend;
  if(!p || p.clave !== ab.clave){ p = estado.pend = {base: t.base, clave: ab.clave, k: null, d: null, items: [], error: false, enVuelo: null, envio: null}; estado.pendVer++; }
  if(p.k === k || p.enVuelo === k) return;
  p.enVuelo = k;
  sb.rpc('bm_fila', {p_token: token, p_clave: ab.clave}).then(function(r){
    if(token !== estado.token) return;
    if(r.error && tokenMalo(r.error)){ sesionVencida(); return; }
    if(estado.pend !== p) return; // cambio la seleccion mientras tanto
    if(p.enVuelo === k) p.enVuelo = null;
    var d = Array.isArray(r.data) ? r.data[0] : r.data;
    if(r.error || !d){ console.warn('pendiente', r.error); p.error = true; }
    else { p.k = k; p.d = d; p.items = itemsDeVuelta(d); p.error = false; }
    estado.pendVer++;
    pintarDecidido();
  }, function(err){
    if(p.enVuelo === k) p.enVuelo = null;
    if(estado.pend === p){ console.warn('pendiente', err); p.error = true; estado.pendVer++; pintarDecidido(); }
  });
}

// la botonera original (la de la base), solo si la piden: el iframe se crea recien al abrir el <details>
function abrirOriginal(det){
  if(!det.open || estado.orig) return;
  var t = tandaSel(); if(!t || !t.baseFila) return;
  var marco = document.getElementById('orig-marco'); if(!marco) return;
  var iframe = document.createElement('iframe');
  iframe.id = 'marco-orig'; iframe.title = 'Botonera original';
  iframe.setAttribute('sandbox', 'allow-scripts allow-popups allow-popups-to-escape-sandbox');
  marco.appendChild(iframe);
  estado.orig = nuevoSlot(iframe, t.baseFila.clave);
  sincronizarIframe(estado.orig, t.baseFila);
}
function nuevoSlot(iframe, clave){ return {iframe: iframe, clave: clave, cargado: null, recargar: false, errorAlCargar: null}; }

function pintarPanel(nueva){
  var el = document.getElementById('panel'); if(!el) return;
  modoDetalle();
  var t = tandaSel();
  if(!estado.sel || !t){
    if(estado.sel && !t && estado.filas.length === 0){ el.innerHTML = '<div class="panel-vacio">Cargando…</div>'; return; }
    swipeDesmontarUna();
    el.innerHTML = '<div class="panel-vacio">Elegí una botonera de la lista.</div>';
    estado.vivo = null; estado.orig = null; estado.panelKey = null; estado.decidido = null; estado.pend = null; estado.pend = null;
    return;
  }
  var ab = t.abierta;                          // la vuelta abierta (la que se decide ahora), o null
  var vuelta = !!ab && ab.clave !== t.base;    // abierta pero NO es la original: sus items son filas del bloque unico
  if(ab) swipeCargar(t);                       // trae los datos del swipe (asincrono): decide si aparece el boton
  var swOn = swipeActivo(t) && !(estado.sw && estado.sw.multi);   // modo swipe: reemplaza al iframe y al bloque (con el mazo del home montado no se pisa)
  var swEsp = !swOn && swipeEspera(t);         // swipe prendido y los datos todavia no llegaron: ni iframe ni bloque
  var iframeVivo = !!ab && !vuelta && !swOn && !swEsp;   // tanda sin vueltas y abierta: se decide en la botonera de la plantilla (iframe)
  var conDec = (!ab || vuelta) && !swOn && !swEsp;       // hay un bloque (pendiente + decidido) para mostrar
  var pk = t.base + '|' + (ab ? 'a:' + ab.clave : 'd') + (swOn ? '|sw' : swEsp ? '|sp' : '');
  // se rearma si cambio la tanda o la vuelta abierta, o si falta el DOM
  var falta = (iframeVivo && (!estado.vivo || !document.body.contains(estado.vivo.iframe))) || (conDec && !document.getElementById('dec')) ||
    (swOn && (!estado.sw || !document.body.contains(estado.sw.el)));
  if(nueva || estado.panelKey !== pk || falta){
    estado.panelKey = pk;
    swipeDesmontarUna();
    estado.vivo = null; estado.orig = null; estado.decidido = null; estado.pend = null; estado.pend = null;
    var h = '<button class="btn volver" id="b-lista" type="button">‹ Lista</button><div id="cab"></div>';
    if(iframeVivo) h += '<div class="marco"><iframe id="marco" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox" title="Botonera"></iframe></div>';
    if(conDec){
      h += '<div id="dec"></div>';
      if(t.baseFila) h += '<details class="plegable" id="orig"><summary>Ver la botonera original</summary><div class="marco orig" id="orig-marco"></div></details>';
    }
    if(swEsp) h += '<div class="vacio">Cargando…</div>';
    el.innerHTML = h;
    if(iframeVivo){
      estado.vivo = nuevoSlot(document.getElementById('marco'), ab.clave);
      if(window.ResizeObserver){ try{ new ResizeObserver(medirMarco).observe(document.getElementById('cab')); }catch(e){} }
    }
    var decEl = document.getElementById('dec');
    if(decEl){
      decEl.addEventListener('click', alClickDec); decEl.addEventListener('input', alInputDec);
      decEl.addEventListener('toggle', function(e){ var k = e.target.getAttribute && e.target.getAttribute('data-det'); if(k) estado.detAbierto[k] = e.target.open; }, true);
    }
    var det = document.getElementById('orig');
    if(det) det.addEventListener('toggle', function(){ abrirOriginal(det); });
    document.getElementById('b-lista').addEventListener('click', volverALista);
    if(swOn) swipeMontar();
  }
  document.getElementById('cab').innerHTML = cabeceraHTML(t);
  if(iframeVivo){ medirMarco(); sincronizarIframe(estado.vivo, ab); }
  if(conDec){ sincronizarDecidido(t); sincronizarPend(t); pintarDecidido(); }
  if(estado.orig && t.baseFila) sincronizarIframe(estado.orig, t.baseFila);
}

// alto del iframe = viewport menos lo que hay arriba de el: asi la barra de envio queda siempre a la vista
function medirMarco(){
  var m = document.getElementById('marco'), p = document.getElementById('panel');
  if(!m || !p) return;
  var rm = m.getBoundingClientRect(), rp = p.getBoundingClientRect();
  var ancho = window.matchMedia('(min-width: 860px)').matches;
  var fuera = ancho ? rp.top + window.pageYOffset : 0; // en pantalla ancha, la barra de arriba; en angosta el panel se alinea al tope
  document.documentElement.style.setProperty('--ocupado', Math.ceil((rm.top - rp.top) + fuera + 18) + 'px');
}
window.addEventListener('resize', medirMarco);

function filaPorClave(clave){
  return estado.filas.filter(function(f){ return f.clave === clave; })[0] || null;
}
function slotVigente(slot){ return !!slot && (slot === estado.vivo || slot === estado.orig); }

// slot = {iframe, clave, cargado, ...}: el iframe de la vuelta abierta (estado.vivo) o el de la original (estado.orig); f = la fila de esa clave
function sincronizarIframe(slot, f){
  if(!slot || !slot.iframe) return;
  var clave = f.clave, iframe = slot.iframe;
  var c = slot.cargado;
  var forzar = slot.recargar === clave;
  if(!forzar && c && c.clave === clave && c.updated_at === f.updated_at) return;
  if(c && c.clave === clave){
    // cambio la fila: avisar el estado y recargar el html solo si cambio
    if(c.estado !== f.estado) avisarEstado(slot, f);
    c.estado = f.estado;
  }
  var token = estado.token; if(!token) return;
  sb.rpc('bm_fila', {p_token: token, p_clave: clave}).then(function(r){
    if(token !== estado.token) return;
    if(r.error && tokenMalo(r.error)){ sesionVencida(); return; }
    // el fetch pudo quedar viejo (A -> B -> A): vale solo si el slot, su clave y su iframe siguen siendo los de ahora
    if(!slotVigente(slot) || slot.clave !== clave || iframe !== slot.iframe) return;
    var d = Array.isArray(r.data) ? r.data[0] : r.data;
    if(r.error || !d){ console.warn('html', r.error); return; }
    var cur = slot.cargado;
    var recargar = slot.recargar === clave;
    if(!recargar && cur && cur.clave === clave && cur.html === d.html){
      cur.updated_at = d.updated_at; cur.estado = f.estado; return;
    }
    if(recargar) slot.recargar = false;
    var vigente = filaPorClave(clave) || f;
    slot.cargado = {clave: clave, html: d.html, updated_at: d.updated_at, estado: vigente.estado};
    iframe.onload = function(){ alCargarMarco(slot, iframe, clave); };
    iframe.srcdoc = d.html || '';
  }, function(err){ console.warn('html', err); });
}

// al cargar el iframe: primero las marcas, despues el estado, al final el error pendiente (si hubo)
function alCargarMarco(slot, iframe, clave){
  if(!slotVigente(slot) || iframe !== slot.iframe || !iframe.contentWindow) return;
  var w = iframe.contentWindow;
  var mk = estado.marcas[clave];
  if(mk) w.postMessage({tipo:'botonera-marcas', marcas: mk}, '*');
  var f = filaPorClave(clave); if(f) avisarEstado(slot, f);
  if(slot.errorAlCargar){
    w.postMessage({tipo:'botonera-error', motivo: slot.errorAlCargar}, '*');
    slot.errorAlCargar = null;
  }
}

function avisarEstado(slot, f){
  var iframe = slot && slot.iframe;
  if(iframe && iframe.contentWindow) iframe.contentWindow.postMessage({tipo:'botonera-estado', estado: f.estado}, '*');
}

function guardarMarcas(m){
  var mk = m.marcas;
  if(!mk || typeof mk !== 'object' || !mk.items || typeof mk.items !== 'object') return;
  var limpio = {items: mk.items, notas: typeof mk.notas === 'string' ? mk.notas : ''};
  try{ if(JSON.stringify(limpio).length > 200000) return; }catch(_){ return; }
  estado.marcas[m.clave] = limpio;
  persistirMarcas();
}

/* ---------- contrato con el iframe ----------
   Hay hasta dos iframes: el de una tanda SIN vueltas que sigue abierta (estado.vivo: ahi se decide, con la plantilla) y la botonera
   original plegada (estado.orig, solo lectura). Una vuelta abierta («<base>-r2») ya NO va en iframe: sus items son filas del
   bloque unico «Por decidir» (ver decididoHTML / enviarVuelta). La clave del mensaje es la de la botonera del iframe.
   iframe -> pagina : {tipo:'botonera-respuesta', clave, texto}   -> RPC bm_decidir_pin(p_token, p_clave, p_respuesta, p_version)
                      {tipo:'botonera-marcas', clave, marcas:{items, notas}}  -> se guardan por clave (memoria + localStorage)
   pagina -> iframe : {tipo:'botonera-marcas', marcas}   (al cargar, ANTES del estado)
                      {tipo:'botonera-estado', estado}
                      {tipo:'botonera-ok'} | {tipo:'botonera-error', motivo}
   El iframe va con alto fijo de viewport y scroll adentro: ya no se auto-mide. */
window.addEventListener('message', function(e){
  var slot = null;
  [estado.vivo, estado.orig].forEach(function(s){ if(s && s.iframe && e.source === s.iframe.contentWindow) slot = s; });
  if(!slot) return;
  var m = e.data;
  if(!m || typeof m !== 'object') return;
  function responder(o){ try{ e.source.postMessage(o, '*'); }catch(_){} }
  if(m.tipo === 'botonera-marcas'){ if(slot === estado.vivo && m.clave === slot.clave) guardarMarcas(m); return; }
  if(m.tipo !== 'botonera-respuesta') return;
  if(slot !== estado.vivo || m.clave !== slot.clave){ responder({tipo:'botonera-error', motivo:'Esta botonera ya no está abierta en la página'}); return; }
  var clave = m.clave;
  if(estado.bloqueadas[clave]) return;
  estado.bloqueadas[clave] = true;
  // la version es la de la fila con la que se cargo el iframe: si la botonera cambio, la RPC contesta 'cambio'
  var version = (slot.cargado && slot.cargado.clave === clave) ? slot.cargado.updated_at : null;
  var token = estado.token;
  if(!token){ estado.bloqueadas[clave] = false; return; }
  sb.rpc('bm_decidir_pin', {p_token: token, p_clave: clave, p_respuesta: String(m.texto == null ? '' : m.texto), p_version: version})
    .then(function(r){
      estado.bloqueadas[clave] = false;
      if(r.error && tokenMalo(r.error)){ sesionVencida(); return; }
      if(r.error){ responder({tipo:'botonera-error', motivo: r.error.message || 'No se pudo enviar'}); return; }
      if(r.data === 'decidida'){ responder({tipo:'botonera-ok'}); cargarLista(); }
      else if(r.data === 'cambio'){
        // recargar el iframe con el html nuevo; el error se muestra cuando termine de cargar
        slot.errorAlCargar = 'La botonera cambió mientras decidías. Recargala.';
        slot.recargar = clave;
        cargarLista().then(function(){ var f = filaPorClave(clave); if(f && slot === estado.vivo && slot.recargar === clave) sincronizarIframe(slot, f); });
      }
      else { responder({tipo:'botonera-error', motivo: 'Ya estaba ' + r.data}); cargarLista(); }
    }, function(err){
      estado.bloqueadas[clave] = false;
      responder({tipo:'botonera-error', motivo: (err && err.message) || 'No se pudo enviar'});
    });
});

/* ---------- vivo: poll cada 15 s con la pestaña visible, mas refresco al volver ---------- */
function arrancarVivo(){
  detenerVivo();
  estado.poll = setInterval(function(){ if(!document.hidden) cargarLista(); }, POLL_MS);
  // los "hace X" se refrescan solos
  estado.reloj = setInterval(function(){
    pintarLista();
    var c = document.getElementById('cab'), t = tandaSel();
    if(c && t) c.innerHTML = cabeceraHTML(t);
  }, 60000);
}
function detenerVivo(){
  if(estado.poll){ clearInterval(estado.poll); estado.poll = null; }
  if(estado.reloj){ clearInterval(estado.reloj); estado.reloj = null; }
}

function reducido(){ try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } }
function pl(n, uno, otro){ return n + ' ' + (n === 1 ? uno : otro); }

/* ----- datos: bm_fila de la fila abierta, una vez por clave+estado+updated_at ----- */
function datosDeFila(d){
  var dat = d && d.datos;
  if(typeof dat === 'string'){ try{ dat = JSON.parse(dat); }catch(e){ dat = null; } }
  return dat && typeof dat === 'object' ? dat : null;
}
// los temas son las secciones, en orden. Sin secciones (o con una) hay un solo mazo «Todo»; lo que no matchea va a «Otros»
function armarTemas(items, secs){
  secs = Array.isArray(secs) ? secs.filter(function(s){ return s && typeof s === 'object' && s.id != null && s.id !== ''; }) : [];
  if(secs.length < 2) return [{id: 'todo', titulo: 'Todo', items: items.slice()}];
  var ids = {}, temas = [];
  secs.forEach(function(s){
    var id = String(s.id);
    if(ids[id]) return;
    ids[id] = true;
    temas.push({id: id, titulo: String(s.titulo || s.id), nota: s.nota ? String(s.nota) : '', items: items.filter(function(it){ return String(it.seccion) === id; })});
  });
  temas = temas.filter(function(t){ return t.items.length; });
  var otros = items.filter(function(it){ return !ids[String(it.seccion)]; });
  if(otros.length) temas.push({id: '__otros', titulo: 'Otros', items: otros});
  return temas;

function swipeCargar(t, forzar){
  var ab = t && t.abierta; if(!ab) return;
  var token = estado.token; if(!token) return;
  var k = llaveFila(ab), s = estado.swd;
  if(!s || s.clave !== ab.clave){ s = estado.swd = {clave: ab.clave, k: null, d: null, items: [], temas: [], sig: '', enVuelo: null, listo: false, error: false, cambio: false}; }
  if(forzar) s.k = null;
  if(s.k === k || s.enVuelo === k) return;
  s.enVuelo = k;
  sb.rpc('bm_fila', {p_token: token, p_clave: ab.clave}).then(function(r){
    if(token !== estado.token) return;
    if(r.error && tokenMalo(r.error)){ sesionVencida(); return; }
    if(estado.swd !== s) return; // cambio la fila abierta mientras tanto
    if(s.enVuelo === k) s.enVuelo = null;
    var d = Array.isArray(r.data) ? r.data[0] : r.data;
    if(r.error || !d){ console.warn('swipe', r.error); s.error = true; s.listo = true; s.cambio = false; }
    else {
      var items = itemsDeVuelta(d), dat = datosDeFila(d), secs = dat && dat.secciones;
      var sig = JSON.stringify([items, secs]);

      if(sig !== s.sig){ s.sig = sig; s.items = items; s.temas = armarTemas(items, secs); }
      s.k = k; s.d = d; s.error = false; s.listo = true;
    }
    swipeLlego(s);
  }, function(err){
    if(s.enVuelo === k) s.enVuelo = null;
    if(estado.swd === s){ console.warn('swipe', err); s.error = true; s.listo = true; s.cambio = false; swipeLlego(s); }
  });

function swipeListo(t){
  var ab = t && t.abierta, s = estado.swd;

// con el swipe prendido, mientras no llegan los datos no se arma ni el iframe ni el bloque (evita el parpadeo)
function swipeEspera(t){
  var ab = t && t.abierta, s = estado.swd;

function swipeLlego(s){
  var t = tandaSel(); if(!t || !t.abierta || t.abierta.clave !== s.clave) return;
  var sw = estado.sw;
  if(sw && sw.el && sw.clave === s.clave && s.cambio){
    sw.aviso = sw.aviso || 'La botonera cambió. Armé el mazo de nuevo con tus marcas.';

function swipeMontar(deck){
  swipeDesmontar();
  deck = deck || swDeckUna(); if(!deck || !deck.temas.length) return;
  var root = document.createElement('div');
  root.className = 'sw'; root.id = 'sw';
  root.setAttribute('role', 'region'); root.setAttribute('aria-label', 'Modo swipe');
  root.innerHTML = '<div class="sw-main" id="sw-main"></div><div class="sw-sheet" id="sw-sheet"></div>';
  document.body.appendChild(root);
  document.documentElement.classList.add('sw-lock');
  var sw = estado.sw = {el: root, main: root.querySelector('#sw-main'), sheetEl: root.querySelector('#sw-sheet'), clave: deck.clave || null,
    modo: deck.modo, multi: deck.modo !== 'una', temas: deck.temas, todas: deck.todas, por: deck.por, bots: deck.bots || null, catNombre: deck.catNombre || '', catId: deck.catId || '',
    tema: 0, cola: [], salt: {}, hist: [], ctxVisto: {}, envio: null, envs: {}, enviando: false, enviadoAlgo: false, aviso: '', arr: false, anim: false, sheet: null,
    rearmar: false, resumen: false, lista: null, tw: null, g: null, px: 0, py: 0, d: null, ultN: null, pd: null};
  swipeArmar(sw, null);
  root.addEventListener('click', swClick);
  root.addEventListener('input', swInput);
  root.addEventListener('pointerdown', swDown);
  root.addEventListener('pointermove', swMove);
  root.addEventListener('pointerup', swUp);
  root.addEventListener('pointercancel', swCancel);
  root.addEventListener('lostpointercapture', function(e){ var s2 = estado.sw; if(s2 && s2.g && e.pointerId === s2.g.id) swAbortar(s2); });
  root.addEventListener('error', function(e){ if(e.target && e.target.tagName === 'IMG') e.target.style.display = 'none'; }, true);
  swipeRender();
}
// el mazo de UNA botonera (la abierta del panel): una entrada por item, un tema por seccion
function swDeckUna(){
  var s = estado.swd; if(!s || !s.temas.length) return null;
  var por = {}, todas = [];
  s.items.forEach(function(it){ var n = String(it.n), e = {cid: n, clave: s.clave, n: n, it: it, bot: null}; por[n] = e; todas.push(e); });
  var temas = s.temas.map(function(t){ return {id: t.id, titulo: t.titulo, nota: t.nota || '', items: t.items.map(function(it){ return por[String(it.n)]; })}; });
  return {modo: 'una', clave: s.clave, temas: temas, todas: todas, por: por, bots: null};
}
// el panel solo desmonta el swipe de UNA botonera: el mazo del home no depende de lo que se elija en el panel
function swipeDesmontarUna(){ if(estado.sw && estado.sw.multi) return; swipeDesmontar(); }
function swipeDesmontar(){
  var sw = estado.sw;
  if(sw){
    if(sw.tw){ sw.tw.cancel(); sw.tw = null; }
    if(sw.el && sw.el.parentNode) sw.el.parentNode.removeChild(sw.el);
  }
  estado.sw = null;
  document.documentElement.classList.remove('sw-lock');
  if(sw && estado.festejo) setTimeout(festejoChequear, 0);
}
// cola por tema = las cards sin marcar, en orden. prev conserva las salteadas (al final, en su orden) y el tema donde estaba
function swipeArmar(sw, prev){
  var orden = {};
  if(prev) prev.cola.forEach(function(q){ q.forEach(function(c, i){ orden[c] = i; }); });
  var salt = {};
  sw.cola = sw.temas.map(function(t){
    var q = t.items.filter(function(e){ return !marcaDe(e.clave, e.n).m; }).map(function(e){ return e.cid; });
    var sal = q.filter(function(c){ return prev && prev.salt[c]; });
    sal.sort(function(a, b){ return (orden[a] || 0) - (orden[b] || 0); });
    sal.forEach(function(c){ salt[c] = true; });
    return q.filter(function(c){ return !salt[c]; }).concat(sal);
  });
  sw.salt = salt;
  sw.hist = [];
  var ti = -1;
  if(prev && prev.temaId) sw.temas.forEach(function(t, i){ if(t.id === prev.temaId) ti = i; });
  if(ti < 0) sw.temas.forEach(function(t, i){ if(ti < 0 && sw.cola[i].length) ti = i; });
  sw.tema = ti >= 0 ? ti : sw.temas.length - 1;
  sw.resumen = false;
}
function swipeRearmar(){
  var sw = estado.sw; if(!sw || sw.multi) return;
  var dk = swDeckUna(); if(!dk) return;
  sw.rearmar = false;
  var prev = {cola: sw.cola, salt: sw.salt, temaId: sw.temas[sw.tema] ? sw.temas[sw.tema].id : null};
  sw.temas = dk.temas; sw.todas = dk.todas; sw.por = dk.por;
  if(sw.tw){ sw.tw.cancel(); sw.tw = null; }
  swipeArmar(sw, prev);
  if(sw.envio && sw.envio.st === 'error') sw.envio = null;
  sw.ultN = null;
  swipeRender();
}
// hay un gesto, una animacion de salida o una hoja abierta: no se repinta la card
function swipeOcupado(sw){ return !!(sw && (sw.arr || sw.anim || sw.sheet)); }
function swLibre(){
  var sw = estado.sw;
  if(sw && sw.rearmar && !swipeOcupado(sw)) swipeRearmar();
}
function primeraActiva(sw){
  var q = sw.cola[sw.tema] || [];
  for(var i = 0; i < q.length; i++) if(!sw.salt[q[i]]) return q[i];
  return null;
}
function activasN(sw, ti){
  return (sw.cola[ti] || []).filter(function(n){ return !sw.salt[n]; }).length;
}
function siguienteTema(sw){
  for(var j = sw.tema + 1; j < sw.cola.length; j++) if(sw.cola[j].length) return j;
  return -1;
}
// card de contexto: la primera vez que sale una card de una botonera, antes de ella. Se «ve» al pasarla (swipe o Empezar);
// no marca nada, no entra en hist ni en los conteos, y Deshacer/Saltear no la vuelven a mostrar (ctxVisto sobrevive al rearmado)
function swCtxPend(sw){
  if(sw.resumen) return null;
  var n = primeraActiva(sw); if(n == null) return null;
  var e = sw.por[n];
  return e && !sw.ctxVisto[e.clave] ? e : null;
}
function swipeVista(sw){
  if(sw.resumen) return 'fin';
  var q = sw.cola[sw.tema] || [];
  if(activasN(sw, sw.tema)) return swCtxPend(sw) ? 'ctx' : 'card';
  if(q.length) return 'salt';
  return siguienteTema(sw) >= 0 ? 'tema' : 'fin';
}
function swConteo(ti){
  var sw = estado.sw, its = ti == null ? sw.todas : sw.temas[ti].items, c = {tot: its.length, va: 0, no: 0, hechas: 0, sin: 0};
  c.ot = 0;   // no entiendo / ya está hecho / después: marcadas, pero ni Va ni No va
  its.forEach(function(e){ var m = marcaDe(e.clave, e.n).m; if(m === 'go' || m === 'vc' || m === 'op') c.va++; else if(m === 'no') c.no++; else if(m) c.ot++; });
  c.hechas = c.va + c.no + c.ot; c.sin = c.tot - c.hechas;
  return c;
}
function swVence(v){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v || '')); if(!m) return '';
  var d = new Date(), hoy = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  return '<span class="sw-vence' + (String(v) <= hoy ? ' venc' : '') + '">vence ' + (+m[3]) + '-' + SW_MESES[+m[2] - 1] + '</span>';
}
// el dibujo va como <img> con data: URI, asi el svg no ejecuta nada (ni scripts ni handlers) aunque venga con cualquier cosa
function swDibujo(it, cls){
  var d = it.dibujo; if(!d || typeof d !== 'object' || !d.svg) return '';
  var vb = /^[\d.\s-]+$/.test(String(d.viewBox || '')) ? String(d.viewBox) : '0 0 240 100';
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '"><style>' + SW_CSS_DIB + '</style>' + String(d.svg) + '</svg>';
  return '<img class="' + cls + '" alt="' + esc(d.alt || '') + '" src="data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg) + '">';
}
// accent de la card: danger = «ojo», warning = «sensible» (los mismos que la plantilla)
function acentoTag(it){
  var a = it && it.accent;
  return a === 'danger' ? '<span class="ac-tag danger">ojo</span>' : a === 'warning' ? '<span class="ac-tag warning">sensible</span>' : '';
}
function swTagsHTML(it){
  var h = swVence(it.vence) + acentoTag(it);
  return h ? '<div class="sw-tags">' + h + '</div>' : '';
}
// icono de la card (solo si no hay dibujo): una clave de iconos.json o un svg propio, viewBox 64, como <img> con data: URI
function swIcono(it, cls){
  if(it.dibujo && typeof it.dibujo === 'object' && it.dibujo.svg) return '';
  var svg = it.svg ? String(it.svg) : it.icono && SW_ICONOS[it.icono] ? SW_ICONOS[it.icono] : '';
  if(!svg) return '';
  var acc = it.accent === 'danger' || it.accent === 'warning' ? ' ' + it.accent : '';
  return '<img class="' + cls + acc + '" alt="" src="data:image/svg+xml;charset=utf-8,' +
    encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><style>' + SW_CSS_DIB + '</style>' + svg + '</svg>') + '">';
}
// «Qué pasó hasta acá» + «Si no decidís» en la cara de la card (texto plano: un link ahi se dispararia sin querer)
function swAntecHTML(it){
  var an = Array.isArray(it.antecedentes) ? it.antecedentes.slice(0, 3) : [];
  return (an.length ? '<div class="sw-ant"><b>Qué pasó hasta acá</b><ul>' + an.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>' : '') +
    (it.si_no_decidis ? '<p class="sw-ant"><b>Si no decidís:</b> ' + esc(it.si_no_decidis) + '</p>' : '');
}
// lo que se sabe de la botonera de una card: {clave, titulo, cat, d, dat, items, nTemas, sesion, creada}. null si ya no esta
function swBotInfo(sw, clave){
  var d, items, titulo, cat, ses, sec;
  if(sw.multi){
    var rec = null;
    (sw.bots || []).forEach(function(b){ if(b.clave === clave) rec = b; });
    if(!rec) return null;
    d = rec.d; items = rec.items; titulo = rec.titulo; cat = rec.cat; ses = rec.sesion; sec = rec.secs;
  } else {
    var s = estado.swd, t = tandaSel(); if(!s || s.clave !== clave) return null;
    d = s.d; items = s.items; sec = null; ses = t && t.entrada && t.entrada.sesion_titulo;
    titulo = (t && t.entrada && t.entrada.titulo) || (d && d.titulo) || clave;
  }
  var dat = datosDeFila(d) || {};
  if(!sw.multi){ cat = catDe(dat); sec = dat.secciones; }
  var o = dat.origen && typeof dat.origen === 'object' ? dat.origen : {};
  return {clave: clave, titulo: titulo || clave, cat: cat, d: d || {}, dat: dat, items: items, nTemas: armarTemas(items, sec).length,
    sesion: ses || (d && d.sesion_titulo) || o.sesion_titulo || '', creada: (d && d.created_at) || ''};
}
// cada card dice de que categoria viene; el chip abre el contexto de su botonera (inerte: en la hoja de detalle no hace nada). Con varias botoneras suma el titulo
function swChipHTML(e, inerte){
  var sw = estado.sw, b = e && sw ? swBotInfo(sw, e.clave) : null; if(!b) return '';
  var cat = b.cat, cont = catIcono(cat, 'sw-cic') + esc(cat.nombre), st = 'background:' + esc(cat.color);
  var chip = inerte ? '<span class="sw-catchip" style="' + st + '">' + cont + '</span>'
    : '<button type="button" class="sw-catchip" data-a="ctx" style="' + st + '" aria-label="Ver de qué va ' + esc(b.titulo) + '">' + cont + '</button>';
  return '<div class="sw-orig">' + chip + (sw.multi ? '<span class="sw-bt">' + esc(b.titulo) + '</span>' : '') + '</div>';
}
// cuerpo del card de contexto (el mismo en el mazo y en la hoja): chip, titulo, contexto, sesion, cuantas cards, intro y fyi plegado
function swCtxCuerpo(b){
  var dat = b.dat, cat = b.cat, n = b.items.length, hace = haceCuanto(b.creada);
  var ses = b.sesion ? 'De ' + b.sesion + (hace ? ' · ' + hace : '') : (hace ? 'Armada ' + hace : '');
  var intro = Array.isArray(dat.intro) ? dat.intro : [];
  var f = dat.fyi && typeof dat.fyi === 'object' ? dat.fyi : null;
  var h = '<div class="sw-cx-k">De qué va</div>' +
    '<div class="sw-orig"><span class="sw-catchip" style="background:' + esc(cat.color) + '">' + catIcono(cat, 'sw-cic') + esc(cat.nombre) + '</span></div>' +
    '<h2>' + esc(b.titulo) + '</h2>' + (dat.contexto ? '<p class="sw-ctx">' + lnk(dat.contexto) + '</p>' : '') +
    (ses ? '<p class="sw-cx-ses">' + esc(ses) + '</p>' : '') +
    '<p class="sw-cx-n">' + esc(pl(n, 'card', 'cards') + (b.nTemas > 1 ? ' en ' + b.nTemas + ' temas' : '')) + '</p>';
  intro.forEach(function(bl){
    if(!bl || typeof bl !== 'object') return;
    h += '<div class="sw-blk">' + (bl.titulo ? '<b>' + esc(bl.titulo) + '</b>' : '') +
      (bl.texto ? String(bl.texto).split(/\n\n+/).map(function(p){ return '<p>' + lnk(p) + '</p>'; }).join('') : '') +
      (Array.isArray(bl.items) ? '<ul>' + bl.items.map(function(x){ return '<li>' + lnk(x) + '</li>'; }).join('') + '</ul>' : '') + '</div>';
  });
  if(f){
    h += '<details class="sw-fyi"><summary>' + esc(f.titulo || 'Para tu info — no son decisiones') + '</summary>' + (f.lead ? '<p class="lf">' + esc(f.lead) + '</p>' : '') +
      (Array.isArray(f.grupos) ? f.grupos.map(function(g){
        if(!g || typeof g !== 'object') return '';
        return (g.titulo ? '<div class="gt">' + esc(g.titulo) + '</div>' : '') + '<ul>' + (Array.isArray(g.items) ? g.items : []).map(function(x){ return '<li>' + lnk(x) + '</li>'; }).join('') + '</ul>';
      }).join('') : '') + '</details>';
  }
  return h;
}
function swAcc(it){ return {va: it.accion_va || 'Va', no: it.accion_no_va || 'No va'}; }
function swRecoHTML(it){
  if(!String(it.reco || '').trim()) return '';
  if(mqOpciones(it)) return '<p class="sw-reco">Te recomiendo: <b class="r-go">' + esc(String(it.reco).split(',').map(function(id){ return mqEtiqueta(it, id.trim()); }).join(', ')) + '</b>' + (it.reco_motivo ? ' · ' + esc(it.reco_motivo) : '') + '</p>';
  var a = swAcc(it), va = recoVa(it);

    (it.reco_motivo ? ' · ' + esc(it.reco_motivo) : '') + '</p>';

/* ----- pintado ----- */
function swipeRender(){
  var sw = estado.sw; if(!sw || !sw.main) return;
  if(sw.tw){ sw.tw.cancel(); sw.tw = null; }
  sw.anim = false;
  if(sw.tema >= sw.temas.length) sw.tema = Math.max(0, sw.temas.length - 1);
  if(sw.lista){ swListaRender(sw); return; }
  var v = swipeVista(sw), T = sw.temas[sw.tema], c = swConteo(), ct = swConteo(sw.tema), env = sw.envio || {};
  var bloq = env.st === 'enviando' || env.st === 'ok' || sw.enviadoAlgo;
  var pos = Math.min(ct.tot, ct.hechas + 1), prog;
  if(sw.multi){
    // Swipear todo: «2 de 9 · 7/23 marcadas»; una categoria: «Casa · 2 de 9»
    if(sw.modo === 'cat') prog = '<b>' + esc(sw.catNombre) + '</b> · ' + (v === 'card' ? pos + ' de ' + ct.tot : ct.hechas + '/' + ct.tot + ' marcadas');
    else prog = (v === 'card' ? '<b>' + pos + ' de ' + ct.tot + '</b> · ' : '') + c.hechas + '/' + c.tot + ' marcadas';
  } else if(v === 'fin') prog = c.hechas + '/' + c.tot + ' marcadas';
  else {
    prog = '<b>' + esc(T.titulo) + '</b>';
    if(v === 'card') prog += ' · ' + pos + ' de ' + ct.tot;
    prog += ' · ' + c.hechas + '/' + c.tot + ' marcadas';
  }
  // la nota de la seccion de la card del frente va debajo del nombre del tema (en el home, con el nombre de la seccion)
  var nota = '';
  if(v === 'card'){
    var fe = sw.por[primeraActiva(sw)], sc = sw.multi ? (fe && fe.sec) : (T && T.nota ? {titulo: '', nota: T.nota} : null);
    if(sc && sc.nota) nota = '<div class="sw-nota" id="sw-nota">' + (sc.titulo ? '<b>' + esc(sc.titulo) + '</b> · ' : '') + esc(sc.nota) + '</div>';
  }
  // «Terminar y enviar» siempre a mano con algo marcado: manda ya lo marcado, sin pasar por las salteadas ni por las que faltan
  var envYa = v !== 'fin' && c.hechas > 0 && !bloq ? '<button type="button" class="sw-b sw-env" data-a="terminar">Terminar y enviar</button>' : '';
  var h = '<div class="sw-top"><button type="button" class="sw-b" data-a="salir">‹ Salir</button>' +
    '<span class="sw-tr">' + envYa + (sw.multi ? '' : '<button type="button" class="sw-b" data-a="temas">Temas</button>') + '</span></div>' +
    '<div class="sw-prog" id="sw-prog">' + prog + '</div>' + nota +
    (sw.aviso ? '<div class="sw-aviso" role="status">' + esc(sw.aviso) + '</div>' : '');
  var n = null, e = null, it = null, a = null, cb = null;
  h += '<div class="sw-stage">';
  if(v === 'ctx'){
    e = swCtxPend(sw); cb = swBotInfo(sw, e.clave); n = 'ctx|' + e.clave;
    h += '<div class="sw-stack" id="sw-stack">' +
      '<div class="sw-hints ctx" aria-hidden="true">' +
        '<div class="sw-h go"><i>' + SW_ICO_GO + 'Empezar</i></div>' +
        '<div class="sw-h no"><i>' + SW_ICO_GO + 'Empezar</i></div>' +
        '<div class="sw-h up"><i>' + SW_ICO_GO + 'Empezar</i></div></div>' +
      '<div class="sw-card ctx" id="sw-card" tabindex="0" role="group" aria-label="Contexto de ' + esc(cb ? cb.titulo : '') + '">' +
        '<div class="sw-cscroll">' + (cb ? swCtxCuerpo(cb) : '') + '</div></div></div>';
  } else if(v === 'card'){
    n = primeraActiva(sw); e = sw.por[n]; it = e.it; a = swAcc(it);
    h += '<div class="sw-stack" id="sw-stack">' +
      (activasN(sw, sw.tema) > 1 ? '<div class="sw-peek" aria-hidden="true"></div>' : '') +
      '<div class="sw-hints' + (mqOpciones(it) ? ' solo-up' : '') + '" aria-hidden="true">' +
        '<div class="sw-h go"><i>' + SW_ICO_GO + esc(a.va) + '</i></div>' +
        '<div class="sw-h no"><i>' + SW_ICO_NO + esc(a.no) + '</i></div>' +
        '<div class="sw-h up"><i>' + SW_ICO_UP + 'Al final</i></div></div>' +
      '<div class="sw-card" id="sw-card" tabindex="0" role="group" aria-label="Card ' + esc(pos) + ' de ' + esc(ct.tot) + '">' +
        '<div class="sw-ct">' + swChipHTML(e) + swTagsHTML(it) + '<h2>' + esc(it.titulo) + '</h2>' +
        (it.contexto ? '<p class="sw-ctx">' + esc(it.contexto) + '</p>' : '') +
        swDibujo(it, 'sw-dib') + swIcono(it, 'sw-ico') + imagenHTML(it, 'sw-img', true) + swAntecHTML(it) + swRecoHTML(it) + swPendHTML(e) + '</div>' +
        '<div class="sw-fade" aria-hidden="true">Tocá para ver más</div></div></div>';
  } else if(v === 'salt'){
    var ns = (sw.cola[sw.tema] || []).length, sg = siguienteTema(sw);
    h += '<div class="sw-msg"><h2>' + pl(ns, 'quedó para el final', 'quedaron para el final') + '</h2><p>' + (sw.multi ? 'En el mazo' : 'En ' + esc(T.titulo)) + ' solo quedan las cards que dejaste para el final.</p>' +
      '<button type="button" class="sw-big" data-a="repasar">Repasarlas</button>' +
      (sg >= 0 ? '<button type="button" class="sw-big alt" data-a="sig">Siguiente tema: ' + esc(sw.temas[sg].titulo) + ' (' + sw.cola[sg].length + ')</button>'
               : '<button type="button" class="sw-big alt" data-a="resumen">Ir al resumen</button>') + '</div>';
  } else if(v === 'tema'){
    var sg2 = siguienteTema(sw);
    h += '<div class="sw-msg"><h2>Terminaste ' + esc(T.titulo) + ' · ' + ct.va + ' Va · ' + ct.no + ' No va</h2>' +
      '<p>Llevás ' + c.hechas + '/' + c.tot + ' marcadas.</p>' +
      '<button type="button" class="sw-big" data-a="sig">Siguiente: ' + esc(sw.temas[sg2].titulo) + ' (' + sw.cola[sg2].length + ')</button></div>';
  } else if(sw.multi){

    h += '<div class="sw-msg"><h2>' + (c.sin ? 'Terminaste el recorrido' : 'Marcaste todo') + '</h2>' +
      ((sw.cola[sw.tema] || []).length === 0 && !sw.resumen ? '<p>Terminaste ' + esc(T.titulo) + ' · ' + ct.va + ' Va · ' + ct.no + ' No va</p>' : '') +
      '<p class="sw-tot">' + c.va + ' Va · ' + c.no + ' No va · ' + c.sin + ' sin marcar</p>' +
      (!bloq && estado.swd ? swFinComHTML(notasDe(estado.swd.clave), 1) : '') +
      '<button type="button" class="sw-big" data-a="enviar"' + (bloq ? ' disabled' : '') + '>' + lbl + '</button>' +
      (c.sin && !bloq ? '<button type="button" class="sw-big alt" data-a="repasar-todo">' + (c.sin === 1 ? 'Repasar la que quedó sin marcar' : 'Repasar las ' + c.sin + ' sin marcar') + '</button>' : '') +
      (env.st === 'error' && env.msg ? '<div class="sw-err" role="status">' + esc(env.msg) + '</div>' : '') +
      (env.st === 'ok' ? '<p>La sesión ya tiene tu respuesta.</p>' : '') + '</div>';
  }
  h += '</div><div class="sw-bar">';
  if(v === 'ctx'){
    h += '<button type="button" class="sw-big" data-a="empezar">Empezar a decidir →</button>';
    // CTA2: la misma botonera, todas las cards en una lista (para piezas que se entienden juntas)

  }
  h += swSecHTML(sw, bloq, v === 'card') +
    (v === 'card' ? '<div class="sw-keys">' + (mqOpciones(it) ? '↑ Al final · tocá una opción' : '← No va · ↑ Al final · → Va') + '</div>' : v === 'ctx' ? '<div class="sw-keys">← ↑ → Empezar</div>' : '') + '</div>';
  sw.main.innerHTML = h;
  // el contexto scrollea por dentro; solo si desborda deja el gesto vertical al navegador (si no, arriba lo pasa como cualquier swipe)
  var cs = sw.main.querySelector('.sw-cscroll');
  if(cs && cs.scrollHeight > cs.clientHeight + 1) cs.classList.add('ov');
  var card = sw.main.querySelector('#sw-card');
  sw.d = card ? {card: card, hgo: sw.main.querySelector('.sw-h.go'), hno: sw.main.querySelector('.sw-h.no'), hup: sw.main.querySelector('.sw-h.up')} : null;

/* ----- animaciones (por tiempo; el reloj cae a setTimeout si el navegador pausa requestAnimationFrame) ----- */
function sigFrame(fn){
  var hecho = false, id = 0;
  function go(){ if(hecho) return; hecho = true; fn(); }
  try{ id = window.requestAnimationFrame(go); }catch(e){}
  setTimeout(function(){ try{ if(id) window.cancelAnimationFrame(id); }catch(e){} go(); }, 50);
}
function tween(dur, f, fin){
  var t0 = performance.now(), cancelado = false;
  function paso(){
    if(cancelado) return;
    var p = Math.min(1, (performance.now() - t0) / (dur * 1000));
    f(p);
    if(p >= 1){ if(fin) fin(); return; }
    sigFrame(paso);
  }
  sigFrame(paso);
  return {cancel: function(){ cancelado = true; }};
}
// resorte de vuelta (stiffness 420, damping 34); sin resorte con reduced-motion
function resorte(x0, y0, vx, vy, fin){
  var x = x0, y = y0, t0 = performance.now(), last = t0, cancelado = false;
  function paso(){
    if(cancelado) return;
    var now = performance.now(), dt = Math.min(0.032, (now - last) / 1000); last = now;
    var pasos = Math.max(1, Math.ceil(dt / 0.004)), h = dt / pasos;
    for(var i = 0; i < pasos; i++){
      vx += (-420 * x - 34 * vx) * h; x += vx * h;
      vy += (-420 * y - 34 * vy) * h; y += vy * h;
    }
    var fuera = now - t0 > 1500;
    if(fuera || (Math.abs(x) < 0.4 && Math.abs(y) < 0.4 && Math.abs(vx) < 8 && Math.abs(vy) < 8)){ swPos(0, 0); if(fin) fin(); return; }
    swPos(x, y);
    sigFrame(paso);
  }
  sigFrame(paso);
  return {cancel: function(){ cancelado = true; }};
}
function swEntrar(sw){
  var card = sw.d && sw.d.card; if(!card) return;
  var red = reducido();
  card.style.opacity = '0';
  sw.tw = tween(red ? 0.1 : 0.22, function(p){
    var e = 1 - Math.pow(1 - p, 3);
    card.style.opacity = String(e);
    if(!red) swPos(0, 16 * (1 - e));
  }, function(){ card.style.opacity = ''; swPos(0, 0); sw.tw = null; });
  if(sw.tw) sw.tw.ent = true; // swDown lo distingue del resorte de vuelta
}
// posicion de la card + carteles + borde
function swPos(x, y){
  var sw = estado.sw, d = sw && sw.d; if(!d || !d.card) return;
  sw.px = x; sw.py = y;
  var rot = Math.max(-12, Math.min(12, x / 200 * 12));
  d.card.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0) rotate(' + rot + 'deg)';
  var arriba = y < -28 && Math.abs(y) >= Math.abs(x) * 0.88;
  var go = (x > 0 && !arriba) ? Math.min(1, Math.sqrt(x / SW_RAMPA)) : 0;
  var no = (x < 0 && !arriba) ? Math.min(1, Math.sqrt(-x / SW_RAMPA)) : 0;
  var up = (y < 0 && !(Math.abs(x) > 40 && Math.abs(y) < Math.abs(x) * 0.92)) ? Math.min(1, Math.sqrt(-y / SW_RAMPA)) : 0;
  d.hgo.style.opacity = String(go); d.hno.style.opacity = String(no); d.hup.style.opacity = String(up);
  var max = Math.max(go, no, up), st = d.card.style;
  if(max <= 0.05){ st.borderColor = ''; st.boxShadow = ''; return; }
  if(go >= no && go >= up){ st.borderColor = '#8ECAC8'; st.boxShadow = '0 0 0 1px rgba(142,202,200,.45)'; }
  else if(no >= up){ st.borderColor = '#262626'; st.boxShadow = '0 0 0 1px rgba(0,0,0,.18)'; }
  else { st.borderColor = 'rgb(107,114,128)'; st.boxShadow = '0 0 0 1px rgba(107,114,128,.25)'; }
}
// sale la card (gesto, boton o tecla) y despues se aplica la accion
function swSalir(dir, fn){
  var sw = estado.sw; if(!sw || sw.anim || !sw.d || sw.sheet) return;
  var env = sw.envio || {}; if(env.st === 'enviando' || env.st === 'ok') return;
  if(sw.tw){ sw.tw.cancel(); sw.tw = null; }
  sw.anim = true;
  var n0 = primeraActiva(sw);
  var x0 = sw.px, y0 = sw.py, W = window.innerWidth || 400, H = window.innerHeight || 700;
  var tx = dir === 'right' ? W * 1.15 : dir === 'left' ? -W * 1.15 : x0;
  var ty = dir === 'up' ? -Math.max(520, H * 0.8) : y0;
  sw.tw = tween(reducido() ? 0.18 : 0.28, function(p){
    var e = 1 - Math.pow(1 - p, 3);
    swPos(x0 + (tx - x0) * e, y0 + (ty - y0) * e);
  }, function(){
    if(estado.sw !== sw) return;
    sw.tw = null; sw.anim = false;
    if(sw.sheet || primeraActiva(sw) !== n0){ swipeRender(); return; } // la card que salio ya no es la del frente: no se marca nada
    if(fn){ sw.aviso = ''; fn(); return; } // las maquetas marcan otra cosa que go/no/salt
    swipeAccion(dir === 'right' ? 'go' : dir === 'left' ? 'no' : 'salt');
  });
}
function swVolver(vx, vy){
  var sw = estado.sw; if(!sw) return;
  if(sw.tw){ sw.tw.cancel(); sw.tw = null; }
  var x0 = sw.px, y0 = sw.py;
  if(reducido()){
    sw.tw = tween(0.2, function(p){ var e = 1 - Math.pow(1 - p, 3); swPos(x0 * (1 - e), y0 * (1 - e)); }, function(){ sw.tw = null; swLibre(); });
  } else {
    sw.tw = resorte(x0, y0, Math.max(-3000, Math.min(3000, vx || 0)), Math.max(-3000, Math.min(3000, vy || 0)), function(){ sw.tw = null; swLibre(); });
  }
}

/* ----- acciones sobre el mazo ----- */
function swCtxPasar(sw){
  var e = swCtxPend(sw);
  if(e) sw.ctxVisto[e.clave] = true;
  sw.aviso = '';
  swipeRender();
}
function swipeAccion(que){
  var sw = estado.sw; if(!sw) return;
  if(swipeVista(sw) === 'ctx'){ swCtxPasar(sw); return; }   // cualquier direccion pasa el contexto: no marca ni saltea nada
  var n = primeraActiva(sw); if(n == null){ swipeRender(); return; }
  sw.aviso = '';
  if(que === 'salt') swipeSaltear(sw, n); else swipeMarcar(sw, n, que);
}
function swipeMarcar(sw, cid, m){
  var e = sw.por[cid], q = sw.cola[sw.tema], i = q.indexOf(cid);
  if(!e) return;
  if(i >= 0) q.splice(i, 1);
  setMarca(e.clave, e.n, 'm', m);
  sw.hist.push({t: 'm', n: cid, tema: sw.tema});
  delete sw.salt[cid];
  sw.resumen = false;
  swipeRender(); swLibre();
}
function swipeSaltear(sw, n){
  var q = sw.cola[sw.tema], i = q.indexOf(n);
  if(i >= 0) q.splice(i, 1);
  q.push(n);
  sw.hist.push({t: 's', n: n, tema: sw.tema, salt: !!sw.salt[n]});
  sw.salt[n] = true;
  sw.resumen = false;
  swipeRender(); swLibre();
}
function swipeDeshacer(){
  var sw = estado.sw; if(!sw) return;
  var env = sw.envio || {}; if(env.st === 'enviando' || env.st === 'ok' || sw.enviadoAlgo) return;
  var h = sw.hist.pop(); if(!h) return;
  var q = sw.cola[h.tema], e = sw.por[h.n];
  if(h.t === 'm'){
    if(e) setMarca(e.clave, e.n, 'm', '');
    delete sw.salt[h.n];
  } else {
    var i = q.lastIndexOf(h.n); if(i >= 0) q.splice(i, 1);
    if(h.salt) sw.salt[h.n] = true; else delete sw.salt[h.n];
  }
  var k = q.indexOf(h.n); if(k >= 0) q.splice(k, 1);   // en «todas juntas», Cambiar ya la pudo devolver a la cola
  q.unshift(h.n);
  sw.tema = h.tema; sw.resumen = false; sw.aviso = '';
  swipeRender(); swLibre();
}
function swipeIrTema(i){
  var sw = estado.sw; if(!sw || !sw.temas[i]) return;
  sw.tema = i; sw.resumen = false; sw.ultN = null;
  swipeCerrarHoja();
  swipeRender();
}
function swipeRepasar(todo){
  var sw = estado.sw; if(!sw) return;
  if(todo){
    sw.salt = {};
    var ti = -1;
    sw.cola.forEach(function(q, i){ if(ti < 0 && q.length) ti = i; });
    if(ti >= 0) sw.tema = ti;
  } else {
    (sw.cola[sw.tema] || []).forEach(function(n){ delete sw.salt[n]; });
  }
  sw.resumen = false; sw.ultN = null;
  swipeRender();
}

/* ----- vista «todas juntas»: las cards de una botonera en una lista (CTA2 de la portada). Marca con las mismas funciones del mazo ----- */
function swTemaDe(sw, cid){
  for(var i = 0; i < sw.temas.length; i++) if(sw.temas[i].items.some(function(x){ return x.cid === cid; })) return i;
  return -1;
}
// la card tocada pasa a ser la del frente de su tema: así Editar, +info y las opciones corren igual que en el mazo
function swListaFoco(sw, cid){
  var e = sw.por[cid], ti = swTemaDe(sw, cid); if(!e || ti < 0) return false;
  var q = sw.cola[ti], i = q.indexOf(cid); if(i < 0) return false;
  q.splice(i, 1); q.unshift(cid); delete sw.salt[cid];
  sw.tema = ti; sw.resumen = false; sw.ctxVisto[e.clave] = true;
  return true;
}
// Cambiar: la card marcada vuelve a quedar sin marcar, con su comentario
function swListaCambiar(sw, cid){
  var e = sw.por[cid], ti = swTemaDe(sw, cid); if(!e || ti < 0) return;
  setMarca(e.clave, e.n, 'm', '');
  // vuelve a su lugar original entre las que faltan
  var q = sw.cola[ti], ord = sw.temas[ti].items.map(function(x){ return x.cid; }), mi = ord.indexOf(cid);
  if(q.indexOf(cid) < 0){

    q.splice(j, 0, cid);

// de vuelta al mazo: arranca en el primer tema que tiene algo
function swListaSalir(sw){

function swClick(e){

    // las casillas marcadas en el Detalle pasan a las de la card antes de que «Listo» las lea
    var chk = Array.prototype.map.call(sw.sheetEl.querySelectorAll('input[data-chk]'), function(i){ return i.checked; });

    if(!swListaFoco(sw, lcid)) return;
    if(a === 'go' || a === 'no'){ swipeMarcar(sw, lcid, a); return; }
    if(a === 'salt'){ swipeSaltear(sw, lcid); return; }
    // lo que en el mazo abre una hoja para escribir, acá usa el comentario de la misma card: si está vacío, lo pide ahí
    var le = sw.por[lcid], lop = (mqOpciones(le.it) || {lista: []}).lista, ta = lc.querySelector('textarea[data-com]');
    function abiertaId(id){ return mqAbierta(lop.filter(function(o){ return String(o.id) === id; })[0]); }
    var lchk = Array.prototype.map.call(lc.querySelectorAll('input[data-chk]:checked'), function(i){ return i.getAttribute('data-chk'); });
    if(a === 'editar' && mqOpciones(le.it)){ mqHojaOpEd(sw, lcid); return; }   // en opciones, Editar abre su hoja (elegir + qué cambia)
    if(a === 'editar' && mqCampos(le.it).length){ mqHojaEd(sw, lcid); return; }   // con campos, Editar abre su hoja también en «todas juntas»
    var pide = a === 'editar' || a === 'com-go' || a === 'com-no' || (a === 'op' && abiertaId(b.getAttribute('data-id'))) ||

    if(pide && ta){
      if(!ta.value.trim()){

        ta.focus(); return;
      }
      if(a === 'editar') swipeMarcar(sw, lcid, 'vc');
      else if(a === 'com-go' || a === 'com-no') swipeMarcar(sw, lcid, a === 'com-no' ? 'no' : 'go');
      else mqMarcar(sw, lcid, 'op', a === 'op' ? [b.getAttribute('data-id')] : lchk);
      return;
    }
  }
  if(a === 'lista'){
    var ce = swCtxPend(sw); if(!ce) return;
    sw.ctxVisto[ce.clave] = true; sw.lista = ce.clave; sw.aviso = '';
    swipeRender(); return;
  }
  if(a === 'lista-salir'){ swListaSalir(sw); return; }
  if(a === 'lista-ir'){
    var g = sw.main.querySelector('#sw-lg-' + b.getAttribute('data-i')); if(g) g.scrollIntoView({block: 'start', behavior: reducido() ? 'auto' : 'smooth'});
    return;
  }
  if(mqClick(sw, a, b)) return;
  if(a === 'salir'){ if(sw.multi) swipeSalirMulti(); else volverALista(); }
  else if(a === 'temas') swipeTemas();
  else if(a === 'cerrar') swVolverHoja(sw);
  else if(a === 'tema') swipeIrTema(Number(b.getAttribute('data-i')));
  else if(a === 'go') swSalir('right');
  else if(a === 'no') swSalir('left');
  else if(a === 'salt') swSalir('up');
  else if(a === 'deshacer') swipeDeshacer();
  else if(a === 'mas') swipeDetalle();
  else if(a === 'ctx') swipeContexto();
  else if(a === 'empezar') swCtxPasar(sw);
  else if(a === 'sig'){ var j = siguienteTema(sw); if(j >= 0) swipeIrTema(j); }
  else if(a === 'repasar') swipeRepasar(false);
  else if(a === 'repasar-todo') swipeRepasar(true);
  else if(a === 'resumen'){ sw.resumen = true; swipeRender(); }
  else if(a === 'terminar'){ sw.lista = null; sw.resumen = true; enviarSwipe(); }   // enviarSwipe pinta el resumen con el estado del envio
  else if(a === 'enviar') enviarSwipe();
  else if(a === 'enviar-medias') enviarMulti(true);
  else if(a === 'home') swipeSalirMulti();
  else if(a === 'cat'){ var cid = b.getAttribute('data-cat'); estado.homeCat = null; swipeSalirMulti(); homeElegirCat(cid); }
  else if(a === 'tanda'){ var ck = b.getAttribute('data-clave'); swipeSalirMulti(); homeSwipear(null, ck); }

function swVel(pts){

  if(e.target.closest('button.sw-catchip,summary,a')) return;   // el chip, el fyi plegable y los links reciben su click: no capturan el puntero ni arrastran

// descarta un gesto sin pointerup (boton ya suelto, captura perdida, ventana sin foco): la card vuelve y no se marca nada

function swFinGesto(sw, e){

      else {
        var dat = datosDeFila(d);
        r.d = d; r.k = k; r.items = itemsDeVuelta(d); r.secs = dat && dat.secciones; r.cat = catDe(dat); r.error = false; r.listo = true;
      }
      homePintar();
    }, function(err){
      if(r.enVuelo === k) r.enVuelo = null;
      if(estado.hd[clave] === r){ console.warn('home', err); r.error = !r.d; r.listo = true; homePintar(); }
    });
  });
  Object.keys(estado.hd).forEach(function(c){ if(!abiertas[c]) delete estado.hd[c]; });
}
// numeros del home: por botonera abierta con items, y por categoria con pendientes
function homeCalc(){
  var bots = [], cargando = false, fallan = 0, cats = {}, tot = {pend: 0, hoy: 0, bots: 0};
  Object.keys(estado.hd).forEach(function(c){
    var r = estado.hd[c];
    if(!r.listo) cargando = true;
    else if(r.error) fallan++;
    else if(r.d && r.items.length) bots.push(r);
  });
  bots.forEach(function(r){
    var pend = 0, hoy = 0, marc = 0, prim = r.tanda && (r.tanda.baseFila || r.tanda.vueltas[0]);
    r.items.forEach(function(it){ if(marcaDe(r.clave, it.n).m) marc++; else { pend++; if(venceYa(it)) hoy++; } });
    r.pend = pend; r.hoy = hoy; r.marc = marc;
    r.titulo = (r.tanda && r.tanda.entrada.titulo) || r.clave;
    r.creada = prim ? ms(prim.created_at) : 0;
    var c = cats[r.cat.id] || (cats[r.cat.id] = {id: r.cat.id, cat: r.cat, bots: [], pend: 0, hoy: 0, marc: 0, tot: 0});
    c.bots.push(r); c.pend += pend; c.hoy += hoy; c.marc += marc; c.tot += r.items.length;
    if(pend){ tot.pend += pend; tot.hoy += hoy; tot.bots++; }
  });
  // listas para enviar: abiertas, con todas sus cards marcadas (las a medias vuelven en el proximo mazo)
  var listas = bots.filter(function(r){ return r.pend === 0; });
  var filas = Object.keys(cats).map(function(k){ return cats[k]; }).filter(function(c){ return c.pend > 0; });
  filas.sort(function(a, b){
    var pa = catPos(a.cat), pb = catPos(b.cat);
    return pa === pb ? 0 : (pa < pb ? -1 : 1);   // sin restar: Infinity - Infinity daria NaN
  });
  return {bots: bots, listas: listas, cats: filas, todasCats: cats, pend: tot.pend, hoy: tot.hoy, nbots: tot.bots, cargando: cargando, fallan: fallan};
}

/* ---------- avisos (Web Push) ---------- */
function avisosSoportado(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function avisosIphone(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function avisosInstalada(){ return navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches); }
// lo que muestra el home: nada si ya estan activos
function avisosHTML(){
  var st = estado.avisos;

  if(avisosIphone() && !avisosInstalada()) return '<div class="home-avisos">Para recibir avisos, agregala a inicio: Compartir → Agregar a inicio.</div>';
  if(!avisosSoportado()) return '';
  if(typeof Notification !== 'undefined' && Notification.permission === 'denied') return '<div class="home-avisos">Los avisos están bloqueados. Se activan en los ajustes del celu.</div>';
  return '<div class="home-avisos"><button type="button" data-home="avisos"' + (st === 'activando' ? ' disabled' : '') + '>' + (st === 'activando' ? 'Activando…' : 'Activar avisos') + '</button>' +
    (st === 'error' ? '<span>No se pudo activar. Probá de nuevo.</span>' : '') + '</div>';
}
function avisosB64(s){
  var r = atob(s.replace(/-/g, '+').replace(/_/g, '/') + '===='.slice(0, (4 - s.length % 4) % 4)), u = new Uint8Array(r.length);
  for(var i = 0; i < r.length; i++) u[i] = r.charCodeAt(i);
  return u;
}
function avisosRegistro(){ return navigator.serviceWorker.register('/sw.js', {scope: '/'}); }
function avisosGuardar(sub){
  var j = sub.toJSON();
  return sb.rpc('bm_push_suscribir', {p_token: estado.token, p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth}).then(function(r){
    if(r.error) throw r.error;
  });
}
function avisosSuscribir(reg){
  return sb.rpc('bm_push_clave', {p_token: estado.token}).then(function(r){
    if(r.error || !r.data) throw (r.error || new Error('sin clave'));
    return reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: avisosB64(r.data)});
  }).then(avisosGuardar);
}
// el permiso se pide solo aca, con el toque del usuario
function avisosActivar(){
  estado.avisos = 'activando'; homePintar();
  Notification.requestPermission().then(function(p){
    if(p !== 'granted') throw new Error('sin permiso');
    return avisosRegistro();
  }).then(function(reg){
    return navigator.serviceWorker.ready.then(function(){ return avisosSuscribir(reg); });
  }).then(function(){ estado.avisos = 'activos'; homePintar(); }, function(err){
    console.warn('avisos', err);
    estado.avisos = 'error'; homePintar();
  });
}
// al entrar: si el permiso sigue dado, la suscripcion se repone o se refresca, y se limpian los avisos en pantalla
function avisosAlEntrar(){
  if(!avisosSoportado() || Notification.permission !== 'granted') return;
  avisosRegistro().then(function(reg){
    return navigator.serviceWorker.ready.then(function(){
      reg.getNotifications().then(function(l){ l.forEach(function(n){ n.close(); }); }, function(){});
      return reg.pushManager.getSubscription();
    }).then(function(sub){ return sub ? avisosGuardar(sub) : avisosSuscribir(reg); });
  }).then(function(){ estado.avisos = 'activos'; homePintar(); }, function(err){ console.warn('avisos', err); });
}
function avisosIcono(n){
  if(!navigator.setAppBadge) return;

// tocar una categoria: con 2+ botoneras pendientes se eligen en tarjetitas negras; con una sola, derecho al mazo

function alClickHome(e){
  var tg = e.target; if(!tg || !tg.closest) return;
  var b = tg.closest('[data-home]'); if(!b) return;
  var a = b.getAttribute('data-home');
  if(a === 'visto') errorVisto(b.getAttribute('data-id'));
  else if(a === 'enviar') homeEnviar();
  else if(a === 'avisos') avisosActivar();

  else if(a === 'volver'){ estado.homeCat = null; homePintar(); }

// manda las botoneras listas (todas sus cards marcadas): una por una, con su propio bm_decidir_pin; una que falle no frena a las otras
function homeEnviar(){
  if(estado.homeEnviando || estado.sw) return;
  var token = estado.token; if(!token) return;
  var cola = homeCalc().listas.slice();
  if(!cola.length) return;
  estado.homeEnviando = true; estado.homeEnvs = {};
  var i = 0, oks = 0;
  function fin(){ estado.homeEnviando = false; homePintar(); var p = cargarLista(); if(oks) festejoTras(p); }
  function sig(){
    if(i >= cola.length){ fin(); return; }
    var r = cola[i++], clave = r.clave;
    if(estado.bloqueadas[clave]){ sig(); return; }
    estado.bloqueadas[clave] = true;
    var env = estado.homeEnvs[clave] = {st: 'enviando', msg: '', titulo: r.titulo};
    homePintar();
    sb.rpc('bm_decidir_pin', {p_token: token, p_clave: clave, p_respuesta: textoDe(clave, r.items), p_version: (r.d && r.d.updated_at) || null})
      .then(function(res){
        estado.bloqueadas[clave] = false;
        if(token !== estado.token) return;
        if(res.error && tokenMalo(res.error)){ sesionVencida(); return; }
        if(res.error){ env.st = 'error'; env.msg = res.error.message || 'No se pudo enviar'; }
        else if(res.data === 'decidida'){ env.st = 'ok'; oks++; }
        else if(res.data === 'cambio') env.st = 'cambio';
        else { env.st = 'ya'; env.msg = 'ya estaba ' + res.data; }
        homePintar(); sig();
      }, function(err){
        estado.bloqueadas[clave] = false;
        if(token !== estado.token) return;
        env.st = 'error'; env.msg = (err && err.message) || 'No se pudo enviar';
        homePintar(); sig();
      });
  }
  sig();
}

/* ----- festejo: confeti al enviar, confeti grande al quedar en cero, frase estoica en cero ----- */
// el envío no festeja en el momento del OK: espera a que la lista vuelva y el home cuente lo que quedó.
// Si quedó en cero va solo el grande (nunca los dos encimados), y si el mazo sigue abierto espera a que se vea el home.
// Abrir la app ya en cero no festeja: el festejo nace de un envío de esta visita.
var CONFETI_SRC = 'https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js';
var CONFETI_SRI = 'sha384-sPwMflxqfAN+Q5mvlkLmHiX3PORGbZSXHiSGPTXT9VHCD/AB+b+r+vJWsqprv+7k';
var CONFETI_COLORES = ['#8ECAC8', '#F5F0E8', '#FFD166', '#EF476F', '#FFFFFF'];
var confetiLib = null;
function confetiCargar(){
  if(confetiLib) return confetiLib;
  confetiLib = new Promise(function(ok, mal){
    if(window.confetti){ ok(window.confetti); return; }
    var s = document.createElement('script');
    s.src = CONFETI_SRC; s.integrity = CONFETI_SRI; s.crossOrigin = 'anonymous'; s.async = true;
    s.onload = function(){ if(window.confetti) ok(window.confetti); else { confetiLib = null; mal(); } };
    s.onerror = function(){ confetiLib = null; if(s.parentNode) s.parentNode.removeChild(s); mal(); };   // sin CDN, sin confeti: la app sigue igual
    document.head.appendChild(s);
  });
  return confetiLib;
}
function festejoTras(p){
  var f = estado.festejo = {t: Date.now(), grande: false, listo: false};
  if(!reducido()) confetiCargar().catch(function(){});   // precarga mientras vuelve la lista
  // hasta que vuelve la lista nueva, el home todavía cuenta como lista la botonera recién enviada: no se decide
  function listo(){ f.listo = true; festejoChequear(); }
  Promise.resolve(p).then(listo, listo);
  setTimeout(festejoChequear, 8100);
}
function enCero(H){ return !H.cargando && !H.pend && !H.listas.length && !H.fallan; }
function festejoChequear(){
  var f = estado.festejo; if(!f) return;
  if(Date.now() - f.t > 300e3){ estado.festejo = null; return; }   // un festejo que no se vio en 5 min ya no es de este envío
  if(!f.grande){
    var H = homeCalc();
    if((!f.listo || H.cargando) && Date.now() - f.t < 8000) return;   // homePintar lo vuelve a llamar cuando llegue cada botonera
    if(!f.listo || !enCero(H)){ estado.festejo = null; festejar('chico'); return; }
    f.grande = true;
  }
  var el = document.getElementById('home');
  if(estado.sw || !el || !el.offsetParent) return;   // el grande sale cuando el home en cero está a la vista
  estado.festejo = null;
  if(enCero(homeCalc())) festejar('grande');   // si mientras tanto llegaron cards, ya no es cero: sin festejo
}
function festejar(tipo){
  if(reducido()) return;
  confetiCargar().then(function(lib){
    var cv = document.createElement('canvas');
    cv.className = 'confeti'; cv.setAttribute('aria-hidden', 'true');
    document.body.appendChild(cv);
    var fx = null, vivo = true;
    function sacar(){ if(!vivo) return; vivo = false; try{ if(fx) fx.reset(); }catch(e){} if(cv.parentNode) cv.parentNode.removeChild(cv); }
    // sin worker: la CSP no deja crear uno desde blob:
    try{ fx = lib.create(cv, {resize: true, useWorker: false}); }catch(e){ sacar(); return; }
    function tiro(o){
      o.colors = CONFETI_COLORES; o.disableForReducedMotion = true;
      (window.__confeti || (window.__confeti = [])).push({tipo: tipo, particleCount: o.particleCount});
      try{ return fx(o); }catch(e){ sacar(); return null; }
    }
    if(tipo === 'chico'){
      Promise.resolve(tiro({particleCount: 90, spread: 75, startVelocity: 40, ticks: 70, origin: {y: 0.62}})).then(sacar, sacar);
      setTimeout(sacar, 4000);
      return;
    }
    // grande: cañones desde los dos costados durante 2,5 s y una ráfaga final al centro
    var t0 = Date.now();
    (function canon(){
      if(!vivo) return;
      if(Date.now() - t0 >= 2500){
        Promise.resolve(tiro({particleCount: 220, spread: 120, startVelocity: 52, ticks: 160, origin: {x: 0.5, y: 0.55}})).then(sacar, sacar);
        return;
      }
      tiro({particleCount: 14, angle: 60, spread: 55, startVelocity: 60, ticks: 160, origin: {x: 0, y: 0.75}});
      tiro({particleCount: 14, angle: 120, spread: 55, startVelocity: 60, ticks: 160, origin: {x: 1, y: 0.75}});

    filas: H.cats.map(function(c){ return {id: c.id, nombre: c.cat.nombre, pend: c.pend, hoy: c.hoy, marc: c.marc, tot: c.tot, bots: c.bots.map(function(b){ return b.clave; })}; })};
};

/* ---------- arranque ---------- */
function init(){
  if(!configValida()){
    raiz.innerHTML = '<div class="entrada"><h1>Botonera sin configurar</h1><p>Falta config.js: copiá config.example.js como config.js y completá la URL y la llave publishable de tu proyecto Supabase.</p></div>';
    return;
  }
  if(!window.supabase){
    raiz.innerHTML = '<div class="entrada"><h1>No cargó</h1><p>No pude cargar la librería de acceso. Probá recargar.</p></div>';
    return;
  }
  // sin Supabase Auth: el acceso es el PIN (RPC bm_entrar) y el token vive en localStorage
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: {persistSession: false, autoRefreshToken: false, detectSessionInUrl: false}
  });
  // al volver a la pestaña se pone al dia sin esperar el poll
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden && estado.token){ cargarLista(); avisosAlEntrar(); }
  });
  window.addEventListener('focus', function(){ if(estado.token) cargarLista(); });
  var t = leerToken();
  if(!t){ vistaEntrada(); return; }
  estado.token = t;
  vistaApp();
}
init();

})();
</script>
</body>
</html>
